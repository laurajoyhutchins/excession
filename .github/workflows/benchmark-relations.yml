name: Relational benchmark protocol

# Measurements run explicitly; benchmark correctness already runs in Verify.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  relationships:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Resolve locked Rust dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Compile actual Excession binary
        run: cargo +1.99.1 build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Verify Rust benchmark schema and negative cases
        run: cargo test --offline --locked --manifest-path core/Cargo.toml benchmark::tests
      - name: Independent oracle and Git fixture tests
        run: python3 -m unittest discover -s tests -p test_benchmark_experiments.py -v
      - name: Measure cross-revision relation queries
        run: |
          python3 benchmarks/experiments/relationships.py \
            --bin ./core/target/debug/excession \
            --out "$RUNNER_TEMP/relational" \
            --sizes 8 --fanouts 1,2 --revisions 2 --repetitions 1
          cat "$RUNNER_TEMP/relational/summary.json"
          core/target/debug/excession benchmark validate --report "$RUNNER_TEMP/relational/report.json"
      - name: Preserve immutable source histories and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: excession-relational-benchmark
          path: ${{ runner.temp }}/relational/
          if-no-files-found: warn
