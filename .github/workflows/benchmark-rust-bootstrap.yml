name: Temporary Rust benchmark dependency bootstrap

on:
  pull_request:
    paths:
      - 'core/Cargo.toml'
      - 'core/src/benchmark.rs'
      - '.github/workflows/benchmark-rust-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'bench/rust-reporting'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Lock dependencies and format Rust sources
        run: |
          rustup component add --toolchain 1.99.1 rustfmt
          cargo +1.99.1 generate-lockfile --manifest-path core/Cargo.toml
          cargo +1.99.1 fmt --manifest-path core/Cargo.toml
          cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
      - name: Commit reproducible lockfile and formatting to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/Cargo.lock core/src
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock JSON Schema dependencies and rustfmt reporting'
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
