name: Rust native SCIP concepts oracle

on:
  pull_request:
    paths:
      - .github/workflows/concepts-rust-scip.yml
      - benchmarks/experiments/scip_self_oracle.py
      - benchmarks/experiments/concepts_scip_oracle.py
      - benchmarks/experiments/scip_source_anchors.py
      - benchmarks/fixtures/concepts-scip-source-anchors.json
      - core/src/scip_refactor.rs
      - core/src/concepts_scip.rs
      - core/src/concepts_compile.rs
      - core/src/concepts_author.rs
      - core/src/concepts_mcp.rs
      - core/tests/concepts_scip.rs
      - contracts/concepts/ontology-proposal.v1.schema.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rust-scip:
    # Deep indexing only when its own paths change or explicitly dispatched.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain and native SCIP indexer
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rust-analyzer
          rustup run 1.99.1 rust-analyzer --version
      - name: Restore pinned official SCIP decoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scip-cli"
          curl -fLsS --retry 3 \
            https://github.com/scip-code/scip/releases/download/v0.10.0/scip-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/scip-cli/scip.tar.gz"
          echo "eeb28ebbff443c01609fb1691809958f3f0c7a8651af689a5bc8560061cd8ab0  $RUNNER_TEMP/scip-cli/scip.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/scip-cli/scip.tar.gz" -C "$RUNNER_TEMP/scip-cli" scip
      - name: Compile Excession against locked dependencies
        shell: bash
        run: |
          cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
          cargo +1.99.1 build --locked --offline --manifest-path core/Cargo.toml --bin excession
      - name: Generate real Rust SCIP with the language-native indexer
        shell: bash
        run: |
          set -euo pipefail
          cd core
          # rust-analyzer scip writes index.scip in its cwd; it does not
          # stream the protobuf to stdout. Preserve upstream diagnostics.
          rustup run 1.99.1 rust-analyzer scip . \
            2>"$RUNNER_TEMP/rust-analyzer-scip.log"
          test -s index.scip
          mv index.scip "$RUNNER_TEMP/excession.scip"
          "$RUNNER_TEMP/scip-cli/scip" print --json "$RUNNER_TEMP/excession.scip" > "$RUNNER_TEMP/excession-scip.json"
          test -s "$RUNNER_TEMP/excession-scip.json"
      - name: Independently reconstruct Git-bound native references
        shell: bash
        run: |
          set -euo pipefail
          python3 benchmarks/experiments/scip_self_oracle.py \
            --bin core/target/debug/excession \
            --repo . --source-prefix core \
            --index "$RUNNER_TEMP/excession-scip.json" \
            --indexer-diagnostics "$RUNNER_TEMP/rust-analyzer-scip.log" \
            --out rust-scip-oracle-evidence
      - name: Author and audit one real Rust ontology using indexed evidence
        shell: bash
        run: |
          set -euo pipefail
          BIN=core/target/debug/excession
          INDEX="$RUNNER_TEMP/excession-scip.json"
          OUT=rust-scip-oracle-evidence/agent-authored-ontology
          mkdir -p "$OUT"
          "$BIN" concepts ontology-list --repo . --rev HEAD \
            --index "$INDEX" --source-prefix core --search concepts > "$OUT/sources.json"
          "$BIN" concepts ontology-context --repo . --rev HEAD \
            --index "$INDEX" --source-prefix core \
            --path core/src/concepts_scip.rs > "$OUT/scip-normalization-context.json"
          "$BIN" concepts ontology-context --repo . --rev HEAD \
            --index "$INDEX" --source-prefix core \
            --path core/src/scip_refactor.rs > "$OUT/scip-scanner-context.json"
          COMMIT=$(jq -er '.source_commit' "$OUT/scip-normalization-context.json")
          TREE=$(jq -er '.source_tree' "$OUT/scip-normalization-context.json")
          BATCH=$(jq -er '.batch_id' "$OUT/scip-normalization-context.json")
          FIRST=$(jq -er '.observations[0].observation_id' "$OUT/scip-normalization-context.json")
          SECOND=$(jq -er '.observations[0].observation_id' "$OUT/scip-scanner-context.json")
          jq -n --arg commit "$COMMIT" --arg tree "$TREE" --arg batch "$BATCH" \
            --arg first "$FIRST" --arg second "$SECOND" \
            '{
              schema:"excession.concepts-ontology-proposal.v1",
              source_commit:$commit, source_tree:$tree, batch_id:$batch,
              author_label:"unverified-agent-authored-smoke",
              concepts:[{
                key:"scip-evidence-pipeline",
                name:"SCIP evidence ingestion and normalization",
                definition:"The native SCIP validation and normalized source-evidence modules form a candidate code-intelligence subsystem.",
                rationale:"Source snippets and native references were inspected. The grouping is an authored architectural interpretation, not a verified boundary.",
                members:[
                  {path:"core/src/scip_refactor.rs",observations:[$second]},
                  {path:"core/src/concepts_scip.rs",observations:[$first]}
                ]
              }]
            }' > "$OUT/proposal.json"
          "$BIN" concepts ontology-preview --repo . --rev HEAD \
            --index "$INDEX" --source-prefix core \
            --draft "$OUT/proposal.json" > "$OUT/preview.json"
          jq -e '.status=="UNREVIEWED_LLM_PROPOSAL" and
            (.model.concepts|length)==1 and
            .model.concepts[0].review_status=="UNREVIEWED" and
            (.model.claims|all(.assessment=="PROPOSED" and .behavioral_verification=="UNTESTED"))' \
            "$OUT/preview.json"
          "$BIN" concepts ontology-publish --repo . --rev HEAD \
            --index "$INDEX" --source-prefix core \
            --draft "$OUT/proposal.json" --db "$RUNNER_TEMP/ontology.sqlite" > "$OUT/published.json"
          SNAPSHOT=$(jq -er '.snapshot_id' "$OUT/published.json")
          "$BIN" concepts ontology-audit --repo . --rev HEAD \
            --index "$INDEX" --source-prefix core \
            --draft "$OUT/proposal.json" --db "$RUNNER_TEMP/ontology.sqlite" \
            --snapshot "$SNAPSHOT" > "$OUT/audit.json"
          jq -e '.status=="LLM_PROPOSAL_REPLAYED_UNREVIEWED" and
            (.behavioral_verification_inferred|not)' "$OUT/audit.json"
      - name: Preserve actual native index and independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-native-scip-and-oracle
          path: |
            rust-scip-oracle-evidence/
            ${{ runner.temp }}/excession-scip.json
            ${{ runner.temp }}/rust-analyzer-scip.log
          if-no-files-found: warn
