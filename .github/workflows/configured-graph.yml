name: Configured graph assembly

on:
  pull_request:
    paths:
      - '.github/workflows/configured-graph.yml'
      - 'core/src/graph_assembly.rs'
      - 'core/src/lib.rs'
      - 'core/src/bin/excession.rs'
      - 'tests/configured_graph_probe.py'
      - 'docs/CONFIGURED_GRAPHS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt-debug-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Verify native build/analysis tools
        run: |
          cmake --version | head -n 1
          ninja --version
          clang++ --version | head -n 1
          python3 --version
      - name: Build Excession without third-party Cargo downloads
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --offline --manifest-path core/Cargo.toml --bin excession
      - name: Fetch pinned fmt project
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --branch 11.1.4 \
            https://github.com/fmtlib/fmt.git "$RUNNER_TEMP/fmt"
          test "$(git -C "$RUNNER_TEMP/fmt" rev-parse HEAD)" = "123913715afeb8a437e6388b4473fcc4753e1c9a"
          test -z "$(git -C "$RUNNER_TEMP/fmt" status --porcelain)"
      - name: Compare configured assembly against real CMake/Ninja build
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/configured_graph_probe.py \
            --repo "$RUNNER_TEMP/fmt" \
            --binary "$GITHUB_WORKSPACE/core/target/debug/excession" \
            --output "$RUNNER_TEMP/configured-graphs"
          cat "$RUNNER_TEMP/configured-graphs/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload bounded summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-configured-graphs
          path: ${{ runner.temp }}/configured-graphs/summary.json
          if-no-files-found: warn
          retention-days: 7
