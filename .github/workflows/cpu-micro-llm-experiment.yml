name: CPU MiniLM held-out reranking experiment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cpu-micro-llm-experiment.yml'
      - 'experiments/cpu_llm/**'

permissions:
  contents: read

jobs:
  cpu-minilm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned experiment libraries
        run: |
          python -m pip install 'numpy==2.3.5' 'onnxruntime==1.23.2' 'tokenizers==0.22.1' 'huggingface_hub==1.16.1' 'rank-bm25==0.2.2'
      - name: Check harness syntax
        run: python -m py_compile experiments/cpu_llm/benchmark_minilm.py
      - name: Benchmark MiniLM and classical baselines on pinned Git sources
        run: python experiments/cpu_llm/benchmark_minilm.py
      - name: Preserve measurements, source provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-minilm-cpu-results
          path: cpu_llm_results/
          if-no-files-found: warn
          retention-days: 14
