name: Excession deployable service
on:
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/excession-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Node adapter syntax
        run: |
          node --check deploy/service/start.mjs
          node --check deploy/service/server.mjs
          node --check deploy/cloudrun-bootstrap.mjs
      - name: Verify read-only service contracts
        run: node --test deploy/service/test/server.test.mjs

  container:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build complete Rust-backed container
        run: docker build --pull -f deploy/Dockerfile -t excession-service:local .
      - name: Verify embedded Rust CLI
        run: docker run --rm --entrypoint excession excession-service:local --version
