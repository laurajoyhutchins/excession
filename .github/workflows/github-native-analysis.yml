name: Excession agent analysis (GitHub-native)
run-name: "Excession analysis request ${{ github.event.issue.number || github.run_id }}"

# A GitHub issue is the in-chat request transport. No external service, token,
# GCP, or MCP installation is needed; the connected GitHub app can create issues.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      request:
        description: 'Exact bounded JSON request (see docs/GITHUB_NATIVE_ANALYSIS.md)'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/github-native-analysis.yml'
      - 'config/github-analysis-targets.json'
      - 'tools/github_analysis.py'
      - 'tools/ci/prepare-excession.sh'
      - '.github/ISSUE_TEMPLATE/excession-analysis.md'
      - 'tests/test_github_analysis.py'

permissions:
  contents: read

concurrency:
  group: github-analysis-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  request-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject unauthorized requests and unverifiable source identities
        run: python3 -m unittest discover -s tests -p 'test_github_analysis.py' -v

  analyze:
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.title == 'Excession analysis request' &&
       github.event.issue.user.id == 219002713 &&
       !github.event.issue.pull_request) ||
      (github.event_name == 'workflow_dispatch' &&
       github.actor_id == '219002713')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate owner-originated request before building Rust
        env:
          REQUEST_ACTOR_ID: ${{ github.actor_id }}
        run: |
          python3 tools/github_analysis.py validate \
            --event "$GITHUB_EVENT_PATH" \
            --actor-id "$REQUEST_ACTOR_ID" \
            --out "$RUNNER_TEMP/excession-request.json"
      - name: Derive an exact source/tool/budget index cache identity
        id: cache-identity
        run: |
          python3 tools/github_analysis.py cache-identity \
            --request "$RUNNER_TEMP/excession-request.json" \
            --out "$GITHUB_OUTPUT"
      - name: Verify prior workflow identity before accepting a checkpoint
        if: steps.cache-identity.outputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ steps.cache-identity.outputs.resume_run_id }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/$PREVIOUS_RUN" \
            > "$RUNNER_TEMP/excession-previous-run.json"
      - name: Download exact prior run's immutable index checkpoint
        if: steps.cache-identity.outputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: excession-index-checkpoint-${{ steps.cache-identity.outputs.resume_run_id }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.cache-identity.outputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/excession-previous-checkpoint
      - name: Authenticate and restore a source-bound SQLite checkpoint
        if: steps.cache-identity.outputs.resume_run_id != ''
        env:
          EXCESSION_CACHE_DIR: ${{ runner.temp }}/excession-index-cache
        run: |
          python3 tools/github_analysis.py restore-checkpoint \
            --request "$RUNNER_TEMP/excession-request.json" \
            --checkpoint-dir "$RUNNER_TEMP/excession-previous-checkpoint" \
            --run-metadata "$RUNNER_TEMP/excession-previous-run.json" \
            --out "$RUNNER_TEMP/excession-restore-path.txt"
      - name: Set up pinned Node for the native parser
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Prepare the actual Rust CLI and locked TypeScript parser
        run: bash tools/ci/prepare-excession.sh . release
      - name: Run pinned, read-only source analysis
        env:
          EXCESSION_CACHE_DIR: ${{ runner.temp }}/excession-index-cache
        run: |
          python3 tools/github_analysis.py execute \
            --request "$RUNNER_TEMP/excession-request.json" \
            --binary "$GITHUB_WORKSPACE/core/target/release/excession" \
            --out "$RUNNER_TEMP/excession-evidence"
      - name: Create authenticated immutable index checkpoint
        if: success() && steps.cache-identity.outputs.prefix != ''
        env:
          EXCESSION_CACHE_DIR: ${{ runner.temp }}/excession-index-cache
        run: |
          python3 tools/github_analysis.py publish-checkpoint \
            --request "$RUNNER_TEMP/excession-request.json" \
            --report-dir "$RUNNER_TEMP/excession-evidence" \
            --out "$RUNNER_TEMP/excession-index-checkpoint"
      - name: Publish index checkpoint for an explicit future owner request
        if: success() && steps.cache-identity.outputs.prefix != ''
        uses: actions/upload-artifact@v4
        with:
          name: excession-index-checkpoint-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/excession-index-checkpoint/manifest.json
            ${{ runner.temp }}/excession-index-checkpoint/locator.sqlite
          if-no-files-found: ignore
          retention-days: 30
      - name: Report status and explicit unknowns
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/excession-evidence/summary.md" ]; then
            cat "$RUNNER_TEMP/excession-evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain source-bound report and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-analysis-${{ github.event.issue.number || 'manual' }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/excession-evidence/report.json
            ${{ runner.temp }}/excession-evidence/receipt.json
            ${{ runner.temp }}/excession-evidence/summary.md
          if-no-files-found: warn
          retention-days: 30

  native-smoke:
    # Deep replay only on the explicit ready-for-review transition, not each commit.
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pinned Node for the native parser
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Prepare the actual Rust CLI and locked TypeScript parser
        run: bash tools/ci/prepare-excession.sh . release
      - name: Pin an independently accessible GitHub commit for live retrieval
        env:
          SOURCE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - "$SOURCE_SHA" "$RUNNER_TEMP/source-request.json" <<'PY'
          import json, sys
          sha, path = sys.argv[1:]
          assert len(sha) == 40 and set(sha) <= set("0123456789abcdef")
          request = {
              "schema": "excession.github-analysis-request.v1",
              "repository": "laurajoyhutchins/excession",
              "revision": sha,
              "operation": "locate",
              "task": "Find the agent verification implementation",
              "limit": 5,
          }
          with open(path, "w") as f:
              json.dump(request, f)
          PY
      - name: Fetch exact remote Git objects and analyze with the Rust binary
        run: |
          python3 tools/github_analysis.py execute \
            --request "$RUNNER_TEMP/source-request.json" \
            --binary "$GITHUB_WORKSPACE/core/target/release/excession" \
            --out "$RUNNER_TEMP/source-proof"
          python3 - "$RUNNER_TEMP/source-proof" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          receipt = json.loads((root / "receipt.json").read_text())
          report = json.loads((root / "report.json").read_text())
          assert receipt["status"] == "COMPLETED"
          assert report["schema"] == "excession.agent-locate.v1"
          assert report["source_commit"] == receipt["request"]["revision"]
          assert report["source_tree"] == receipt["source_tree"]
          assert receipt["safe_to_skip_unlisted_tests"] is False
          PY
      - name: Retain independent remote source smoke receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-issue-transport-smoke
          path: |
            ${{ runner.temp }}/source-proof/receipt.json
            ${{ runner.temp }}/source-proof/report.json
            ${{ runner.temp }}/source-proof/summary.md
          if-no-files-found: warn
          retention-days: 7
