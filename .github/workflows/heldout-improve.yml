name: Held-out TypeScript improvement acceptance

# Full native toolchain and independent application build, not commit-fast CI.
# Use a separate public Git source at a fixed commit; no GitHub tokens exposed
# to npm, the project build or tests.
on:
  pull_request:
    paths:
      - 'core/adapters/improve_typescript.cjs'
      - 'core/src/improve_edits.rs'
      - 'tests/improve_typescript.test.cjs'
      - 'tests/heldout_improve_clod_pet.sh'
      - '.github/workflows/heldout-improve.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HELDOUT_SHA: ba9b87d7434d70ce2569fbdb7420ec2b73a73729
      HELDOUT_REPOSITORY: laurajoyhutchins/clod-pet
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Node and Rust
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned Excession producer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Excession language-neutral replay CLI
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
          cargo +1.99.1 build --locked --offline --manifest-path core/Cargo.toml --bin excession
      - name: Checkout a pinned separate public application
        uses: actions/checkout@v4
        with:
          repository: laurajoyhutchins/clod-pet
          ref: ba9b87d7434d70ce2569fbdb7420ec2b73a73729
          path: heldout/clod-pet
          persist-credentials: false
          fetch-depth: 1
      - name: Run held-out native edit and independent build/test acceptance
        shell: bash
        run: |
          bash tests/heldout_improve_clod_pet.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/heldout/clod-pet" \
            "$RUNNER_TEMP/excession-heldout-candidate" \
            "$RUNNER_TEMP/excession-heldout-evidence"
      - name: Retain real held-out acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-heldout-improve
          path: |
            ${{ runner.temp }}/excession-heldout-evidence/*.json
            ${{ runner.temp }}/excession-heldout-evidence/*.log
            ${{ runner.temp }}/excession-heldout-evidence/*.diff
            ${{ runner.temp }}/excession-heldout-evidence/*.txt
          if-no-files-found: warn
