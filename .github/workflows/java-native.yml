name: Java native compiler evidence

on:
  pull_request:
    paths:
      - '.github/workflows/java-native.yml'
      - 'core/adapters/ExcessionJavaNative.java'
      - 'core/src/java_native.rs'
      - 'core/src/jvm_inputs.rs'
      - 'contracts/evidence/jvm-resolved-inputs.v1.schema.json'
      - 'docs/JVM_RESOLVED_INPUTS.md'
      - 'core/src/native_analysis.rs'
      - 'core/src/native_evidence.rs'
      - 'core/src/observed_relations.rs'
      - 'core/src/adapter.rs'
      - 'core/tests/native_analysis_cli.rs'
      - 'docs/JAVA_NATIVE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  java-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify JDK compiler and source launcher
        run: |
          java -version
          javac -version
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Fetch locked Cargo dependencies
        run: cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
      - name: Compile Excession and run real native Java fixtures
        run: |
          cargo +1.99.1 test --offline --locked --manifest-path core/Cargo.toml --test native_analysis_cli native_java -- --nocapture
      - name: Run unit tests for Java Git path handling
        run: |
          cargo +1.99.1 test --offline --locked --manifest-path core/Cargo.toml --lib java_native::tests
