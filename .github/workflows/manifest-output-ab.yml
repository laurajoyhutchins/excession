name: Direct full-manifest output A/B

on:
  pull_request:
    paths:
      - core/src/projection.rs
      - core/src/bin/excession.rs
      - benchmarks/manifest_output_ab.py
      - .github/workflows/manifest-output-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Restore pre-optimization native source
        run: git worktree add --detach "$RUNNER_TEMP/excession-before-manifest" 670c3e4b80d8cc887719c4a020cd254489a2b83d
      - name: Build both Rust release binaries
        run: |
          cargo +1.99.1 build --offline --release --manifest-path "$RUNNER_TEMP/excession-before-manifest/core/Cargo.toml"
          cargo +1.99.1 build --offline --release --manifest-path core/Cargo.toml
      - name: Verify byte identities and benchmark output
        run: |
          python3 benchmarks/manifest_output_ab.py \
            "$RUNNER_TEMP/excession-before-manifest/core/target/release/excession" \
            core/target/release/excession manifest-output-ab.json
      - name: Retain full raw A/B receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-output-ab
          path: manifest-output-ab.json
          if-no-files-found: warn
