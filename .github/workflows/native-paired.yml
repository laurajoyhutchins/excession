name: Native retrieval calibration

on:
  pull_request:
    paths:
      - benchmarks/native_paired.py
      - .github/workflows/native-paired.yml
      - core/src/graph_baseline.rs
      - core/src/projection.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compile native CLI
        run: cargo +1.99.1 build --offline --release --manifest-path core/Cargo.toml
      - name: Measure identical pinned h11 source queries
        run: python3 benchmarks/native_paired.py core/target/release/excession native-calibration.json
      - name: Retain raw paired timings and source-parity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-retrieval-calibration
          path: native-calibration.json
          if-no-files-found: warn
