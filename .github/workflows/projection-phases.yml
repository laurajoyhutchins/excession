name: Projection phase benchmark

on:
  pull_request:
    paths:
      - core/src/projection.rs
      - benchmarks/projection_phases.py
      - .github/workflows/projection-phases.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compile optimized CLI
        run: cargo +1.99.1 build --offline --release --manifest-path core/Cargo.toml
      - name: Measure authenticated projection phases and scaling
        run: python3 benchmarks/projection_phases.py core/target/release/excession projection-phases.json
      - name: Preserve raw phase receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-phase-benchmark
          path: projection-phases.json
          if-no-files-found: warn
