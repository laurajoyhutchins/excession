name: Independent pytest change-impact experiment
on:
  push:
    branches:
      - experiments/pytest-impact-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      OUT: /tmp/excession-pytest-independent
      PYTEST_REPO: /tmp/pytest-independent-source
      HEAD_SHA: dcd0e636b4ce69021a9f607b060ea0056c339fd2
    steps:
      - uses: actions/checkout@v4
      - name: Build real Excession CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
          cargo +1.99.1 build --locked --offline --release --manifest-path core/Cargo.toml --bin excession
      - name: Fetch and pin a real pytest bug-fix revision and its parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$PYTEST_REPO"
          git -C "$PYTEST_REPO" init -q
          git -C "$PYTEST_REPO" remote add origin https://github.com/pytest-dev/pytest.git
          git -C "$PYTEST_REPO" fetch -q --depth=2 origin "$HEAD_SHA"
          git -C "$PYTEST_REPO" checkout -q --detach FETCH_HEAD
          test "$(git -C "$PYTEST_REPO" rev-parse HEAD)" = "$HEAD_SHA"
          git -C "$PYTEST_REPO" rev-parse "$HEAD_SHA^" > "$OUT/base.txt"
          git -C "$PYTEST_REPO" rev-parse "$HEAD_SHA^{tree}" > "$OUT/head-tree.txt"
          git -C "$PYTEST_REPO" diff --name-only "$HEAD_SHA^" "$HEAD_SHA" > "$OUT/changed.txt"
          git -C "$PYTEST_REPO" ls-tree -r --name-only HEAD | wc -l > "$OUT/total-files.txt"
          sha256sum core/target/release/excession > "$OUT/excession.sha256"
      - name: Independent full import-reachability oracle versus Excession
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'benchmarks/experiments')
          from impact_heldout import evaluate
          out = Path('/tmp/excession-pytest-independent')
          base = (out / 'base.txt').read_text().strip()
          try:
              report = evaluate(
                  Path('core/target/release/excession').resolve(),
                  Path('/tmp/pytest-independent-source'), base,
                  'dcd0e636b4ce69021a9f607b060ea0056c339fd2', 'src,testing')
              report['upstream_repository'] = 'pytest-dev/pytest'
          except Exception as exc:
              report = {'status': 'ERROR', 'error': f'{type(exc).__name__}: {exc}'}
          (out / 'independent-impact.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print('Independent oracle status:', report['status'])
          if report['status'] != 'MATCH':
              print('Independent oracle rejected:', report.get('error', report.get('missing')))
              raise SystemExit(1)
          PY
      - name: Cold and warm process-level performance, RSS and output
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(cat "$OUT/base.txt")"
          for arm in cold warm1 warm2 warm3; do
            /usr/bin/time -f '%e %M' -o "$OUT/$arm.time" \
              core/target/release/excession impact "$PYTEST_REPO" \
                --base "$BASE_SHA" --head "$HEAD_SHA" --roots src,testing \
                --db "$OUT/perf.sqlite" --json > "$OUT/$arm.json"
          done
          stat -c %s "$OUT/perf.sqlite" > "$OUT/index-bytes.txt"
      - name: Evaluate competing baselines without reading Excession edges
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'benchmarks/experiments')
          from impact_heldout import independent_edges, inventory, reachable
          out = Path('/tmp/excession-pytest-independent')
          repo = Path('/tmp/pytest-independent-source')
          base = (out / 'base.txt').read_text().strip()
          head = 'dcd0e636b4ce69021a9f607b060ea0056c339fd2'
          changed = set((out / 'changed.txt').read_text().splitlines())
          report = json.loads((out / 'independent-impact.json').read_text())
          cold = json.loads((out / 'cold.json').read_text())
          tree, entries = inventory(repo, head)
          edges, nmodules, unresolved = independent_edges(repo, head, entries, {'src', 'testing'})
          direct = {src for src, target in edges if target in changed}
          transitive = reachable(edges, changed)
          produced = {
              effect['entity']['path'] for effect in cold['effects']
              if effect['entity']['source_commit'] == head
          }
          tests = {p for p in transitive if p.startswith('testing/')}
          head_effects = [effect for effect in cold['effects']
                          if effect['entity']['source_commit'] == head]
          witness_targets = {p: sorted({effect['entity']['path'] for effect in head_effects
              if effect['hops'] and effect['hops'][-1]['target']['path'] == p})
              for p in sorted(changed)}
          beyond_changed = transitive - changed
          beyond_direct = transitive - direct - changed
          metrics = {}
          for name in ('cold', 'warm1', 'warm2', 'warm3'):
              wall, kib = (out / (name + '.time')).read_text().split()
              metrics[name] = {'wall_s': float(wall), 'peak_rss_kib': int(kib),
                               'output_bytes': (out / (name + '.json')).stat().st_size}
          summary = {
              'schema': 'excession.external-pytest-impact.v1',
              'repository': 'pytest-dev/pytest',
              'head_commit': head, 'base_commit': base, 'head_tree': tree,
              'changed_files': sorted(changed),
              'independent_static_modules': nmodules,
              'independent_static_edges': len(edges),
              'independent_unresolved_import_sites': unresolved,
              'independent_transitive_affected': len(transitive),
              'independent_direct_affected': len(direct),
              'independent_test_candidates': len(tests),
              'oracle_test_candidates_not_in_diff': sorted(tests-changed)[:50],
              'candidate_paths_beyond_git_diff': len(beyond_changed),
              'candidate_paths_beyond_direct_imports': len(beyond_direct),
              'excession_head_unique_paths': len(produced),
              'excession_head_missing_vs_oracle': len(transitive-produced),
              'excession_head_unexpected_vs_oracle': len(produced-transitive),
              'excession_head_test_candidates': len(produced & tests),
              'excession_report_truncated': any(
                  gap.get('reason') == 'TRUNCATED' for gap in cold['coverage']['gaps']),
              'excession_effect_count': len(cold['effects']),
              'head_affected_paths_by_changed_source': {k: len(v) for k,v in witness_targets.items()},
              'oracle_and_impact_wall_seconds': report.get('measured_wall_seconds'),
              'excession_report_coverage': cold['coverage'].get('status'),
              'independent_full_explanation_audit': report.get('status'),
              'independent_audit_error': report.get('error'),
              'baseline': {
                  'git_diff_changed_files_only': len(changed),
                  'independent_ast_one_hop': len(direct),
                  'independent_ast_full_reachability': len(transitive)
              },
              'perf': metrics,
              'sqlite_bytes': int((out / 'index-bytes.txt').read_text()),
              'limitations': [
                  'Import reachability is a candidate, not demonstrated behavior breakage',
                  'The independent AST oracle itself is bounded to literal in-tree Python imports',
                  'The full CI test suite and native semantic indexers are not equivalent baselines',
                  'Truncated Excession results cannot establish complete recall',
                  'No coding-agent task success is inferred from candidate paths'
              ],
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Reproduce historical behavioral failure and verify its fix
        shell: bash
        run: |
          set -euo pipefail
          # This behavioral witness is independent of the static dependency oracle.
          python3 -m pip install -q -e "$PYTEST_REPO"
          cat > "$OUT/regression_probe.py" <<'PY'
          from types import SimpleNamespace
          from _pytest.nodes import Collector

          collector = SimpleNamespace(
              CollectError=Collector.CollectError,
              config=SimpleNamespace(getoption=lambda name, default=False: False),
          )
          excinfo = SimpleNamespace(value=Collector.CollectError())
          # On the parent this raises IndexError due to exc.args[0].
          # On the fixed revision it returns the empty exception message.
          assert Collector.repr_failure(collector, excinfo) == ""
          PY
          BASE_SHA="$(cat "$OUT/base.txt")"
          git -C "$PYTEST_REPO" checkout -q --detach "$BASE_SHA"
          set +e
          (cd "$PYTEST_REPO" && PYTHONPATH=src python3 "$OUT/regression_probe.py") \
            > "$OUT/base-test.log" 2>&1
          base_code=$?
          set -e
          printf '%s\n' "$base_code" > "$OUT/base-test-exit.txt"
          git -C "$PYTEST_REPO" checkout -q --detach "$HEAD_SHA"
          set +e
          (cd "$PYTEST_REPO" && PYTHONPATH=src python3 "$OUT/regression_probe.py") \
            > "$OUT/head-test.log" 2>&1
          head_code=$?
          set -e
          printf '%s\n' "$head_code" > "$OUT/head-test-exit.txt"
          printf 'Historical regression: base_exit=%s head_exit=%s\n' "$base_code" "$head_code"
          cat "$OUT/base-test.log"
          cat "$OUT/head-test.log"
          # A failed setup/import does not count as a reproduced regression.
          test "$base_code" -ne 0
          test "$head_code" -eq 0
          grep -q 'IndexError: tuple index out of range' "$OUT/base-test.log"
          python3 - "$OUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          out = Path(sys.argv[1])
          witness = {
              'schema': 'excession.pytest-behavioral-witness.v1',
              'repository': 'pytest-dev/pytest',
              'base_commit': (out / 'base.txt').read_text().strip(),
              'head_commit': 'dcd0e636b4ce69021a9f607b060ea0056c339fd2',
              'base_exit': int((out / 'base-test-exit.txt').read_text()),
              'head_exit': int((out / 'head-test-exit.txt').read_text()),
              'base_exception': 'IndexError: tuple index out of range',
              'head_result': 'Collector.CollectError() repr_failure is empty string',
              'status': 'BASE_FAIL_HEAD_PASS',
          }
          (out / 'behavioral-witness.json').write_text(json.dumps(witness, indent=2, sort_keys=True) + '\n')
          PY
      - name: Detect a controlled coding-agent-style regression in unchanged tests
        shell: bash
        run: |
          set -euo pipefail
          # The upstream fix is the baseline. Simulate an agent silently
          # reintroducing the exact historical bug, but changing only code.
          python3 - "$PYTEST_REPO/src/_pytest/nodes.py" <<'PY'
          from pathlib import Path
          import sys
          source = Path(sys.argv[1])
          text = source.read_text()
          good = '            return str(excinfo.value)\n'
          broken = '            exc = excinfo.value\n            return str(exc.args[0])\n'
          assert text.count(good) == 1, 'the upstream code has changed'
          source.write_text(text.replace(good, broken, 1))
          PY
          git -C "$PYTEST_REPO" add -- src/_pytest/nodes.py
          git -C "$PYTEST_REPO" -c user.name='Excession independent benchmark' \
            -c user.email='benchmark@example.invalid' \
            commit -qm 'Controlled agent regression: restore empty-args crash'
          FAULT_SHA="$(git -C "$PYTEST_REPO" rev-parse HEAD)"
          printf '%s\n' "$FAULT_SHA" > "$OUT/fault-commit.txt"
          git -C "$PYTEST_REPO" diff --name-only "$HEAD_SHA" "$FAULT_SHA" \
            > "$OUT/fault-changed.txt"
          test "$(cat "$OUT/fault-changed.txt")" = 'src/_pytest/nodes.py'
          set +e
          (cd "$PYTEST_REPO" && PYTHONPATH=src python3 "$OUT/regression_probe.py") \
            > "$OUT/fault-test.log" 2>&1
          fault_exit=$?
          set -e
          printf '%s\n' "$fault_exit" > "$OUT/fault-test-exit.txt"
          test "$fault_exit" -ne 0
          grep -q 'IndexError: tuple index out of range' "$OUT/fault-test.log"
          python3 - "$OUT" "$FAULT_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'benchmarks/experiments')
          from impact_heldout import evaluate
          out = Path(sys.argv[1])
          candidate = sys.argv[2]
          fixed = 'dcd0e636b4ce69021a9f607b060ea0056c339fd2'
          result = evaluate(
              Path('core/target/release/excession').resolve(),
              Path('/tmp/pytest-independent-source'), fixed, candidate, 'src,testing')
          test_path = 'testing/test_nodes.py'
          assert result['status'] == 'MATCH', result
          assert test_path not in result['changed_paths'], result['changed_paths']
          assert test_path in result['oracle'][candidate]['expected_affected_paths']
          assert test_path in result['actual'][candidate]
          receipt = {
              'schema': 'excession.external-pytest-controlled-regression.v1',
              'base_commit': fixed,
              'candidate_commit': candidate,
              'changed_paths': result['changed_paths'],
              'unmodified_regression_test': test_path,
              'independent_import_oracle': result['status'],
              'excession_flagged_unmodified_test': True,
              'independent_behavioral_failure': 'IndexError: tuple index out of range',
              'oracle_affected_paths': len(result['oracle'][candidate]['expected_affected_paths']),
              'excession_affected_paths': len(result['actual'][candidate]),
              'limitations': 'Controlled seeded regression, not a recorded mistake by an independent coding agent. Full AST oracle has the same reachability.'
          }
          (out / 'controlled-regression.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Compare mature dynamic test selection with a prewarmed testmon baseline
        shell: bash
        run: |
          set -euo pipefail
          # testmon is a real, stronger alternative to file-diff selection.
          # Give it a valid baseline before requesting incremental selection.
          python3 -m pip install -q 'pytest-testmon==2.3.0'
          python3 -m pip show pytest-testmon > "$OUT/native-testmon-version.txt"
          git -C "$PYTEST_REPO" checkout -q --detach "$HEAD_SHA"
          # A shallow historical fetch reports pytest 0.1.devN because no
          # release tag is reachable. Override only the self-test minversion;
          # keep source, fixtures, selectors, and the pytest plugin unchanged.
          rm -f "$PYTEST_REPO/.testmondata"
          set +e
          (cd "$PYTEST_REPO" && /usr/bin/time -f '%e %M' -o "$OUT/testmon-baseline.time" \
            env PYTHONPATH=src python3 -m pytest -o minversion=0.0 --testmon --testmon-noselect \
              testing/test_nodes.py::test_collector_repr_failure_collect_error -q \
              > "$OUT/testmon-baseline.log" 2>&1)
          base_code=$?
          set -e
          printf '%s\n' "$base_code" > "$OUT/testmon-baseline-exit.txt"
          test "$base_code" -eq 0 || { cat "$OUT/testmon-baseline.log"; exit 1; }
          test -s "$PYTEST_REPO/.testmondata"
          set +e
          (cd "$PYTEST_REPO" && /usr/bin/time -f '%e %M' -o "$OUT/testmon-unchanged.time" \
            env PYTHONPATH=src python3 -m pytest -o minversion=0.0 --testmon --testmon-forceselect \
              testing/test_nodes.py::test_collector_repr_failure_collect_error -q \
              > "$OUT/testmon-unchanged.log" 2>&1)
          unchanged_code=$?
          set -e
          printf '%s\n' "$unchanged_code" > "$OUT/testmon-unchanged-exit.txt"
          # Same implementation-only fault: no test file modified.
          FAULT_SHA="$(cat "$OUT/fault-commit.txt")"
          git -C "$PYTEST_REPO" checkout -q --detach "$FAULT_SHA"
          test "$(git -C "$PYTEST_REPO" diff --name-only "$HEAD_SHA" "$FAULT_SHA")" = 'src/_pytest/nodes.py'
          set +e
          (cd "$PYTEST_REPO" && /usr/bin/time -f '%e %M' -o "$OUT/testmon-fault.time" \
            env PYTHONPATH=src python3 -m pytest -o minversion=0.0 --testmon --testmon-forceselect \
              testing/test_nodes.py::test_collector_repr_failure_collect_error -q \
              > "$OUT/testmon-fault.log" 2>&1)
          fault_code=$?
          set -e
          printf '%s\n' "$fault_code" > "$OUT/testmon-fault-exit.txt"
          # Invalid test collection / environment / plugin errors are not
          # evidence that an existing tool missed a regression.
          if [ "$fault_code" -ne 1 ]; then
            cat "$OUT/testmon-fault.log"
            echo 'Native testmon comparison could not establish test selection' >&2
            exit 1
          fi
          grep -q 'IndexError: tuple index out of range' "$OUT/testmon-fault.log"
          python3 - "$OUT" "$PYTEST_REPO" <<'PY'
          import json
          from pathlib import Path
          import sys
          out, repo = map(Path, sys.argv[1:])
          def times(name):
              wall, peak = (out / (name + '.time')).read_text().split()
              return {'wall_seconds': float(wall), 'peak_rss_kib': int(peak)}
          summary = {
              'schema': 'excession.pytest-native-test-selection-comparison.v1',
              'native_tool': 'pytest-testmon',
              'native_version': '2.3.0',
              'test_scope': 'testing/test_nodes.py::test_collector_repr_failure_collect_error',
              'baseline_collected_under_fixed_revision': True,
              'baseline_exit': int((out / 'testmon-baseline-exit.txt').read_text()),
              'unchanged_selection_exit': int((out / 'testmon-unchanged-exit.txt').read_text()),
              'fault_selection_exit': int((out / 'testmon-fault-exit.txt').read_text()),
              'native_detected_controlled_fault': True,
              'testmon_db_bytes_after_fault': (repo / '.testmondata').stat().st_size,
              'timing': {k:times(k) for k in ('testmon-baseline','testmon-unchanged','testmon-fault')},
              'excession_detected_controlled_fault_test_path': True,
              'comparison': 'BOTH_DETECTED',
              'limitations': 'Native tool has a prewarmed executed-test coverage database; Excession needs no test history. Testmon executes selected tests, Excession returns static source candidates. Costs and guarantees are not directly identical.'
          }
          (out / 'native-selection.json').write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Verify agent failure and refuse stale source-bound test receipts
        shell: bash
        run: |
          set -euo pipefail
          FAULT_SHA="$(cat "$OUT/fault-commit.txt")"
          python3 - "$OUT" "$PYTEST_REPO" "$FAULT_SHA" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          out, repo, fault = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          tree = subprocess.check_output(
              ['git', '-C', str(repo), 'rev-parse', fault+'^{tree}'], text=True
          ).strip()
          exit_code = int((out / 'fault-test-exit.txt').read_text())
          assert exit_code != 0
          receipt = {
              'kind': 'TEST', 'status': 'FAIL',
              'source_commit': fault, 'source_tree': tree,
              'producer': 'github-actions-pinned-pytest-probe',
              'command': 'PYTHONPATH=src python3 /tmp/excession-pytest-independent/regression_probe.py',
              'exit_code': exit_code,
              'log_sha256': hashlib.sha256((out / 'fault-test.log').read_bytes()).hexdigest(),
          }
          payload = {'schema': 'excession.execution-receipts.v1', 'receipts': [receipt]}
          (out / 'fault-receipt.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          stale = json.loads(json.dumps(payload))
          stale['receipts'][0]['source_commit'] = 'dcd0e636b4ce69021a9f607b060ea0056c339fd2'
          (out / 'stale-receipt.json').write_text(json.dumps(stale, indent=2, sort_keys=True) + '\n')
          PY
          /usr/bin/time -f '%e %M' -o "$OUT/agent-verify.time" \
            core/target/release/excession agent verify \
              --repo "$PYTEST_REPO" --base "$HEAD_SHA" --candidate "$FAULT_SHA" \
              --roots src,testing --db "$OUT/agent-verify.sqlite" --limit 64 \
              --receipts "$OUT/fault-receipt.json" > "$OUT/agent-verify.json"
          set +e
          core/target/release/excession agent verify \
            --repo "$PYTEST_REPO" --base "$HEAD_SHA" --candidate "$FAULT_SHA" \
            --roots src,testing --db "$OUT/agent-verify.sqlite" --limit 64 \
            --receipts "$OUT/stale-receipt.json" \
            > "$OUT/stale-accepted.json" 2> "$OUT/stale-rejected.log"
          stale_code=$?
          set -e
          test "$stale_code" -ne 0
          grep -q 'does not bind to candidate commit/tree' "$OUT/stale-rejected.log"
          python3 - "$OUT" "$FAULT_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          out, fault = Path(sys.argv[1]), sys.argv[2]
          report = json.loads((out / 'agent-verify.json').read_text())
          assert report['schema'] == 'excession.agent-verification.v1'
          assert report['candidate_commit'] == fault
          assert report['status'] == 'REPORTED_FAILURE', report
          assert report['ready_to_merge'] is False
          assert 'REPORTED_TEST_OR_BUILD_FAILURE' in report['obligations']
          assert 'RECEIPT_AUTHENTICITY_UNVERIFIED' in report['obligations']
          assert len(report['receipts']) == 1
          assert report['receipts'][0]['trust'] == 'CALLER_SUPPLIED_UNATTESTED'
          record = {
              'schema': 'excession.pytest-agent-verification-comparison.v1',
              'candidate_commit': fault,
              'test_status': 'FAIL',
              'agent_status': report['status'],
              'ready_to_merge': report['ready_to_merge'],
              'stale_commit_receipt_refused': True,
              'trust_level': report['receipts'][0]['trust'],
              'limitations': 'Receipt contains a locally declared log digest, not signed worker attestation. Agent consumers must honor the status. This compares an evidence-verification capability, not stronger semantic test selection.'
          }
          (out / 'agent-verification-evidence.json').write_text(json.dumps(record, indent=2, sort_keys=True) + '\n')
          print(json.dumps(record, indent=2))
          PY
      - name: Collect independently inspectable artifacts even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-pytest-independent-evidence
          path: /tmp/excession-pytest-independent/
          if-no-files-found: warn
