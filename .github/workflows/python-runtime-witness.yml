name: Python runtime import witness collector

on:
  pull_request:
    paths:
      - 'tools/python_import_observer.py'
      - 'tests/test_python_import_observer.py'
      - 'docs/RUNTIME_OBSERVATIONS.md'
      - '.github/workflows/python-runtime-witness.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python-runtime-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Compile observer and its tests
        run: python3 -m py_compile tools/python_import_observer.py tests/test_python_import_observer.py
      - name: Git-bound import observations and refusals
        run: python3 -m unittest discover -s tests -p test_python_import_observer.py -v
