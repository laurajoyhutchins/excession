name: Auto-integrate reproducible native improvements

# This is a trusted-main producer, never a PR job with a write token.
# The only auto-merging recipe is native-rustfmt, hard-allowlisted by the
# repository's improvement_cycle.py and independently replayed from Git.
on:
  issues:
    types: [opened]
  schedule:
    - cron: '45 10 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: autonomous-rustfmt-main
  cancel-in-progress: false

jobs:
  integrate:
    # Only the repository owner can invoke an issue-triggered maintenance run.
    # The event supplies no commands or file paths to the native producer.
    if: >-
      github.repository == 'laurajoyhutchins/excession' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issues' ||
        (github.event.issue.user.id == 219002713 &&
         github.event.issue.title == '[Excession] Run Rustfmt improvement'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MISE_ENABLE_TOOLS: rust,node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Validate the versioned improvement lessons
        run: |
          set -euo pipefail
          python3 tools/ci/improvement_cycle.py catalog
          python3 -m unittest discover -s tests -p 'test_improvement_cycle.py' -v
          python3 -m unittest discover -s tests -p 'test_quality_ratchet.py' -v
      - name: Generate the first supported automatic improvement
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          BASE="$(git rev-parse HEAD)"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          cargo fmt --manifest-path core/Cargo.toml
          git diff --check
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source transformation is needed; no integration claim." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "automation/native-rustfmt-${GITHUB_RUN_ID}"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            add -u
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'style: apply reproducible pinned rustfmt improvements'
          HEAD="$(git rev-parse HEAD)"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "branch=automation/native-rustfmt-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Independent exact-source replay and native acceptance
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          BASE: ${{ steps.candidate.outputs.base }}
          HEAD: ${{ steps.candidate.outputs.head }}
        run: |
          set -euo pipefail
          python3 tools/ci/improvement_cycle.py verify \
            --base "$BASE" --candidate "$HEAD" \
            --report "$RUNNER_TEMP/native-improvement.json"
          python3 tools/ci/quality_ratchet.py check \
            --base "$BASE" --candidate "$HEAD"
          cargo fmt --manifest-path core/Cargo.toml -- --check
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo test --offline --locked --manifest-path core/Cargo.toml --lib
      - name: Publish one immutable native candidate PR
        if: steps.candidate.outputs.changed == 'true'
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          HEAD: ${{ steps.candidate.outputs.head }}
          BASE: ${{ steps.candidate.outputs.base }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" \
            --title "style: reproducible native Rust formatting" \
            --body "Automatic-integration candidate generated from main at $BASE. The pinned native Rust formatter was independently replayed from the base Git tree with an exact byte-for-byte match to candidate $HEAD. Only tracked Rust source may change. Native tests and the quality ratchet ran locally. Both exact-head Verify and Excession GitHub evidence must pass before merging; no broad semantic-equivalence claim. Recipe: quality/improvement-recipes.json (native-rustfmt)."; then
            echo "::error::GitHub Actions cannot create pull requests in this repository."
            echo "Open a PR from the already-pushed $BRANCH branch after reviewing the native evidence." >> "$GITHUB_STEP_SUMMARY"
            echo "Candidate: https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
            echo "To allow unattended integration, repository administrator must enable Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          PR="$(gh pr view "$BRANCH" --json number --jq .number)"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          # GitHub's GITHUB_TOKEN PR event cannot be relied on to start checks.
          # Explicit dispatch is permitted; pass immutable base/head to evidence.
          gh workflow run verify.yml --ref "$BRANCH"
          gh workflow run github-evidence.yml --ref "$BRANCH" \
            -f base="$BASE" -f head="$HEAD"
      - name: Await both independent exact-head checks and integrate
        if: steps.candidate.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          HEAD: ${{ steps.candidate.outputs.head }}
          BASE: ${{ steps.candidate.outputs.base }}
          PR: ${{ steps.publish.outputs.pr }}
        run: bash tools/ci/await_verified_merge.sh
      - name: Retain exact native reproduction receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-improvement-${{ github.run_id }}
          path: ${{ runner.temp }}/native-improvement.json
          retention-days: 30
          if-no-files-found: warn
