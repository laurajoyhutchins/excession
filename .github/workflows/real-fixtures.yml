name: Real repository projection fixtures

on:
  pull_request:
    paths:
      - benchmarks/experiments/real_fixtures.py
      - benchmarks/experiments/impact_heldout.py
      - benchmarks/experiments/incremental_python.py
      - benchmarks/experiments/incremental_python_scale.py
      - tests/test_incremental_python_experiment.py
      - benchmarks/experiments/dependency_oracle.py
      - benchmarks/experiments/js_import_oracle.cjs
      - core/adapters/python_ast.py
      - benchmarks/fixtures/real-repositories.json
      - .github/workflows/real-fixtures.yml
      - core/src/projection.rs
      - core/src/index.rs
      - core/src/semantic.rs
      - 'core/src/views/projection.rs'
      - 'core/src/graph/index.rs'
      - 'core/src/observe/semantic.rs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Resolve locked Rust dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked JavaScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Excession
        run: cargo +1.99.1 build --offline --release --manifest-path core/Cargo.toml
      - name: Compare real h11 change impact to independent Python AST
        run: |
          H11="$RUNNER_TEMP/excession-h11-impact"
          mkdir -p "$H11"
          git -C "$H11" init -q
          git -C "$H11" fetch -q --depth=2 https://github.com/python-hyper/h11.git fb40afcdf14f1762e3466a01de99ff114b10d228
          git -C "$H11" checkout -q --detach fb40afcdf14f1762e3466a01de99ff114b10d228
          test "$(git -C "$H11" rev-parse HEAD^)" = ea01274303adbb895e1a359ac856241e70184b44
          python3 benchmarks/experiments/impact_heldout.py \
            --bin core/target/release/excession --repo "$H11" \
            --base ea01274303adbb895e1a359ac856241e70184b44 \
            --head fb40afcdf14f1762e3466a01de99ff114b10d228 \
            --roots h11,tests --out heldout-h11-impact-results.json
      - name: Measure incremental Python invalidation against full native adapter and independent AST
        run: |
          python3 benchmarks/experiments/incremental_python.py \
            --repo "$RUNNER_TEMP/excession-h11-impact" \
            --base ea01274303adbb895e1a359ac856241e70184b44 \
            --head fb40afcdf14f1762e3466a01de99ff114b10d228 \
            --roots h11,tests --repetitions 7 \
            --out heldout-h11-incremental-results.json
      - name: Measure 256-module incremental reuse under independent oracle
        run: |
          python3 benchmarks/experiments/incremental_python_scale.py \
            --modules 256 --repetitions 5 \
            --out scaled-incremental-results.json
      - name: Verify immutable upstream fixtures and corruption refusals
        run: |
          python3 benchmarks/experiments/real_fixtures.py \
            --bin core/target/release/excession \
            --manifest benchmarks/fixtures/real-repositories.json \
            --out real-fixture-results.json
      - name: Upload fixture receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-projection-fixture-results
          path: |
            real-fixture-results.json
            heldout-h11-impact-results.json
            heldout-h11-incremental-results.json
            scaled-incremental-results.json
          if-no-files-found: warn
