name: Deterministic Rust codegen historical replay
on:
  pull_request:
    paths:
      - 'core/src/refactor_codegen.rs'
      - 'core/src/refactor_rust_analyzer.rs'
      - 'core/src/refactor_rust_repair.rs'
      - 'core/src/refactor_module_api.rs'
      - 'core/src/agent.rs'
      - 'contracts/agent/**'
      - 'core/src/bin/excession.rs'
      - 'core/src/bin/excession/cli.rs'
      - 'tests/refactor_codegen_replay.sh'
      - '.github/workflows/refactor-codegen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust and rust-analyzer
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup component add --toolchain 1.99.1 rust-src rust-analyzer rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install pinned ast-grep
        run: |
          mkdir -p "$RUNNER_TEMP/ast-grep"
          npm install --prefix "$RUNNER_TEMP/ast-grep" --no-save --no-audit --no-fund @ast-grep/cli@0.51.0
          "$RUNNER_TEMP/ast-grep/node_modules/.bin/ast-grep" --version
      - name: Verify official SCIP decoder
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scip"
          curl -fLsS --retry 3 https://github.com/scip-code/scip/releases/download/v0.10.0/scip-linux-amd64.tar.gz -o "$RUNNER_TEMP/scip/scip.tar.gz"
          echo 'eeb28ebbff443c01609fb1691809958f3f0c7a8651af689a5bc8560061cd8ab0  '"$RUNNER_TEMP/scip/scip.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/scip/scip.tar.gz" -C "$RUNNER_TEMP/scip" scip
          "$RUNNER_TEMP/scip/scip" --version
      - name: Build exact-head Excession CLI
        run: |
          cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
          cargo +1.99.1 build --locked --offline --manifest-path core/Cargo.toml --bin excession
      - name: Replay historical Excession through real tools
        run: |
          bash tests/refactor_codegen_replay.sh "$GITHUB_WORKSPACE/core/target/debug/excession" \
            "$RUNNER_TEMP/ast-grep/node_modules/.bin/ast-grep" "$RUNNER_TEMP/scip/scip" \
            "$RUNNER_TEMP/excession-codegen-test" "$GITHUB_WORKSPACE"
      - name: Preserve source-bound codegen receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-refactor-codegen-replay
          path: |
            ${{ runner.temp }}/excession-codegen-test/scip-report.json
            ${{ runner.temp }}/excession-codegen-test/preview.json
            ${{ runner.temp }}/excession-codegen-test/applied.json
            ${{ runner.temp }}/excession-codegen-test/agent-context.json
            ${{ runner.temp }}/excession-codegen-test/agent-receipts.json
            ${{ runner.temp }}/excession-codegen-test/agent-verification.json
            ${{ runner.temp }}/excession-codegen-test/assist-actions.json
            ${{ runner.temp }}/excession-codegen-test/assist-preview.json
            ${{ runner.temp }}/excession-codegen-test/assist-applied.json
            ${{ runner.temp }}/excession-codegen-test/assist-build.log
            ${{ runner.temp }}/excession-codegen-test/assist-compiler.jsonl
            ${{ runner.temp }}/excession-codegen-test/repair-preview.json
            ${{ runner.temp }}/excession-codegen-test/repair-applied.json
            ${{ runner.temp }}/excession-codegen-test/repair-compiler.jsonl
            ${{ runner.temp }}/excession-codegen-test/repair-build.log
            ${{ runner.temp }}/excession-codegen-test/public-api-before.txt
            ${{ runner.temp }}/excession-codegen-test/public-api-after.txt
            ${{ runner.temp }}/excession-codegen-test/preserved-scip-report.json
            ${{ runner.temp }}/excession-codegen-test/build.log
            ${{ runner.temp }}/excession-codegen-test/test.log
          if-no-files-found: warn
