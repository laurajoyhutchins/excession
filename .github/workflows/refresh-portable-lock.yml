name: Cargo dependency refresh (temporary)

on:
  pull_request:
    paths:
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - ".github/workflows/refresh-portable-lock.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve only new dependencies with pinned Rust
        run: |
          rustup show active-toolchain
          cargo fetch --manifest-path core/Cargo.toml
          python3 - <<'PY'
          import json
          from pathlib import Path
          print('EXCESSION_LOCK_V1=' + json.dumps(Path('core/Cargo.lock').read_text(encoding='utf-8')))
          PY
      - name: Compile replacement libraries
        run: cargo check --manifest-path core/Cargo.toml --all-targets
