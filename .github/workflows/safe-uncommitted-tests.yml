name: Safe uncommitted test snapshots

on:
  pull_request:
    paths:
      - 'core/src/working_tree_tests.rs'
      - 'core/src/bin/excession.rs'
      - 'core/src/bin/excession/cli.rs'
      - 'contracts/agent/test-workflow.v2.schema.json'
      - '.github/workflows/safe-uncommitted-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and test snapshot code
        run: |
          cargo test --locked --manifest-path core/Cargo.toml --lib working_tree_tests
          cargo build --locked --manifest-path core/Cargo.toml --release --bin excession
      - name: Install rootless Podman and local sandbox image
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman uidmap fuse-overlayfs slirp4netns
          podman --remote=false info --format json > "$RUNNER_TEMP/podman-security.json"
          python3 - "$RUNNER_TEMP/podman-security.json" <<'PY'
          import json,sys
          host=json.load(open(sys.argv[1]))['host']
          assert host['security']['rootless'] is True,host['security']
          assert host['security']['seccompEnabled'] is True,host['security']
          assert host['cgroupVersion']=='v2',host
          assert host['serviceIsRemote'] is False,host
          PY
          mkdir -p "$RUNNER_TEMP/sandbox-image"
          cat > "$RUNNER_TEMP/sandbox-image/Dockerfile" <<'DOCKERFILE'
          FROM docker.io/library/ubuntu:24.04
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends git coreutils python3 python3-pip && rm -rf /var/lib/apt/lists/*
          RUN python3 -m pip install --break-system-packages --no-cache-dir pytest==8.4.2 pytest-testmon==2.3.0 pytest-json-report==1.5.0
          DOCKERFILE
          podman build --pull=always --network=host -t excession-snapshot-test "$RUNNER_TEMP/sandbox-image"
          IMAGE_ID="$(podman image inspect --format '{{.Id}}' excession-snapshot-test)"
          printf 'sha256:%s\n' "${IMAGE_ID#sha256:}" > "$RUNNER_TEMP/sandbox-image-id"
          grep -E '^sha256:[0-9a-f]{64}$' "$RUNNER_TEMP/sandbox-image-id"
      - name: Test actual isolated changed source without original checkout mutation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/project"
          mkdir -p "$ROOT/src" "$ROOT/tests"
          cd "$ROOT"
          touch src/__init__.py
          printf 'def value():\n    return 41\n' > src/value.py
          printf 'from src.value import value\ndef test_value():\n    assert value() == 41\n' > tests/test_value.py
          git init -q
          git add .
          git -c user.name=Test -c user.email=test@example.invalid commit -qm base
          HEAD="$(git rev-parse HEAD)"
          python3 -m pip install -q pytest==8.4.2 pytest-testmon==2.3.0 pytest-json-report==1.5.0
          python3 -m pytest --testmon --testmon-noselect -q tests/test_value.py
          test -s .testmondata
          printf 'def value():\n    return 42\n' > src/value.py
          git add src/value.py
          printf 'def value():\n    return 4242\n' > src/value.py
          cat > tests/test_untracked.py <<'PY'
          import socket
          from pathlib import Path
          def test_isolation():
              assert not Path("/home/runner/.ssh").exists()
              try:
                  Path("/host_must_not_be_writable").write_text("broken")
              except OSError:
                  pass
              else:
                  raise AssertionError("container root writable")
              sock = socket.socket()
              sock.settimeout(0.1)
              assert sock.connect_ex(("1.1.1.1", 443)) != 0
              sock.close()
          PY
          find src tests -type d -name __pycache__ -prune -exec rm -rf '{}' +
          INDEX="$(sha256sum .git/index | cut -d' ' -f1)"
          BIN="$GITHUB_WORKSPACE/core/target/release/excession"
          IMAGE="$(cat "$RUNNER_TEMP/sandbox-image-id")"

          "$BIN" tests --repo "$ROOT" --sandbox-image "$IMAGE" --json > "$RUNNER_TEMP/snapshot-plan.json"
          python3 - "$RUNNER_TEMP/snapshot-plan.json" "$HEAD" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['schema']=='excession.test-workflow.v2',p
          assert p['mode']=='PLAN' and p['status']=='READY',p
          assert p['provider']=='pytest-testmon',p
          assert p['working_tree']['source_head']==sys.argv[2]
          assert p['working_tree']['untracked_paths']==['tests/test_untracked.py']
          assert set(p['changed_sources'])=={'src/value.py','tests/test_untracked.py'}
          assert p['next_argv'][-1]!='--unknown'
          assert '--expected-snapshot' in p['next_argv']
          PY
          if "$BIN" tests --repo "$ROOT" --run --json >/dev/null 2>&1; then
            echo 'Unsafe host fallback accepted' >&2; exit 1
          fi
          python3 - "$RUNNER_TEMP/snapshot-plan.json" "$BIN" "$RUNNER_TEMP/snapshot-result.json" <<'PY'
          import json,subprocess,sys
          plan=json.load(open(sys.argv[1]))
          result=subprocess.run([sys.argv[2],*plan['next_argv'][1:]],capture_output=True,text=True)
          open(sys.argv[3],'w').write(result.stdout)
          assert result.returncode==1,(result.returncode,result.stderr,result.stdout[:800])
          PY
          python3 - "$RUNNER_TEMP/snapshot-result.json" "$HEAD" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p['status']=='FAIL',p
          assert p['working_tree']['source_head']==sys.argv[2]
          assert p['working_tree']['receipt_trust']=='EPHEMERAL_LOCAL_SANDBOX_UNATTESTED'
          assert p['executed_test_count']>=1,p
          assert p['selection']['outcome']=='EXECUTED_FAIL',p
          assert not p['safe_to_skip_unlisted_tests']
          PY
          test "$(git rev-parse HEAD)" = "$HEAD"
          test "$(sha256sum .git/index | cut -d' ' -f1)" = "$INDEX"
          grep -q 'return 4242' src/value.py
          git diff --cached -- src/value.py | grep -q 'return 42'
          test -f tests/test_untracked.py
          test ! -e /host_must_not_be_writable
          printf '# changed after plan\n' >> tests/test_untracked.py
          python3 - "$RUNNER_TEMP/snapshot-plan.json" "$BIN" <<'PY'
          import json,subprocess,sys
          plan=json.load(open(sys.argv[1]))
          result=subprocess.run([sys.argv[2],*plan['next_argv'][1:]],capture_output=True,text=True)
          assert result.returncode==2,(result.returncode,result.stdout,result.stderr)
          assert 'fingerprint changed' in result.stderr,result.stderr
          PY
      - name: Retain safe isolated result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-uncommitted-test-evidence
          path: |
            ${{ runner.temp }}/snapshot-plan.json
            ${{ runner.temp }}/snapshot-result.json
          if-no-files-found: ignore
