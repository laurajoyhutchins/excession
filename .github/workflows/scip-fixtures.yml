name: SCIP source-evidence fixtures

on:
  pull_request:
    paths:
      - benchmarks/experiments/scip_fixture_migration.py
      - benchmarks/experiments/concepts_scip_oracle.py
      - benchmarks/experiments/scip_source_anchors.py
      - benchmarks/fixtures/concepts-scip-source-anchors.json
      - tests/test_scip_source_anchors.py
      - tests/test_concepts_scip_oracle.py
      - core/src/concepts_scip.rs
      - core/src/concepts_compile.rs
      - tests/test_scip_fixture_migration.py
      - core/src/scip_refactor.rs
      - core/tests/refactor_contracts.rs
      - benchmarks/fixtures/real-repositories.json
      - .github/workflows/scip-fixtures.yml
  workflow_dispatch:
    inputs:
      fixtures:
        description: "Comma-separated fixture names (empty = all six)"
        required: false
        type: string
        default: ""
      historical:
        description: "Also inspect the 16 pinned h11/Click/Requests/PostCSS histories"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install SCIP native indexers, separate from Excession
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scip-indexers"
          npm install --prefix "$RUNNER_TEMP/scip-indexers" --ignore-scripts \
            --no-audit --no-fund --no-save \
            @sourcegraph/scip-python@0.6.6 \
            @sourcegraph/scip-typescript@0.4.0
          "$RUNNER_TEMP/scip-indexers/node_modules/.bin/scip-python" --help >/dev/null
          "$RUNNER_TEMP/scip-indexers/node_modules/.bin/scip-typescript" --help >/dev/null
      - name: Verify official SCIP decoder distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scip-cli"
          curl -fLsS --retry 3 \
            https://github.com/scip-code/scip/releases/download/v0.10.0/scip-linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/scip-cli/scip.tar.gz"
          echo 'eeb28ebbff443c01609fb1691809958f3f0c7a8651af689a5bc8560061cd8ab0  '"$RUNNER_TEMP/scip-cli/scip.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/scip-cli/scip.tar.gz" -C "$RUNNER_TEMP/scip-cli" scip
          "$RUNNER_TEMP/scip-cli/scip" --version
      - name: Build source-bound Excession CLI
        run: |
          cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
          cargo +1.99.1 build --locked --offline --release --manifest-path core/Cargo.toml --bin excession
      - name: Verify evidence and independent concept oracle contracts
        run: |
          python3 -m unittest discover -s tests -p test_scip_fixture_migration.py -v
          python3 -m unittest discover -s tests -p test_concepts_scip_oracle.py -v
      - name: Run real native SCIP on pinned fixtures
        shell: bash
        env:
          FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.fixtures || '' }}
          HISTORY: ${{ github.event_name == 'workflow_dispatch' && inputs.historical || false }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$FILTER" ]]; then
            IFS=',' read -ra names <<< "$FILTER"
            for name in "${names[@]}"; do args+=(--fixture "$name"); done
          fi
          if [[ "$HISTORY" == 'true' ]]; then args+=(--historical); fi
          python3 benchmarks/experiments/scip_fixture_migration.py \
            --bin core/target/release/excession \
            --out scip-fixture-results.json \
            --evidence-dir scip-fixture-evidence \
            --scip "$RUNNER_TEMP/scip-cli/scip" \
            --python-indexer "$RUNNER_TEMP/scip-indexers/node_modules/.bin/scip-python" \
            --typescript-indexer "$RUNNER_TEMP/scip-indexers/node_modules/.bin/scip-typescript" \
            --trusted-local --concepts --require-positive-concepts --require-positive-source-anchors "${args[@]}"
      - name: Validate a pinned historical PostCSS bundle revision
        shell: bash
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.historical }}
        run: |
          python3 benchmarks/experiments/scip_fixture_migration.py \
            --bin core/target/release/excession \
            --historical --fixture postcss-173614d9c \
            --out scip-historical-results.json \
            --evidence-dir scip-historical-evidence \
            --scip "$RUNNER_TEMP/scip-cli/scip" \
            --python-indexer "$RUNNER_TEMP/scip-indexers/node_modules/.bin/scip-python" \
            --typescript-indexer "$RUNNER_TEMP/scip-indexers/node_modules/.bin/scip-typescript" \
            --trusted-local --concepts
      - name: Preserve actual indexes, audits and coverage gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scip-source-and-concept-evidence
          path: |
            scip-fixture-results.json
            scip-fixture-evidence/
            scip-historical-results.json
            scip-historical-evidence/
          if-no-files-found: warn
