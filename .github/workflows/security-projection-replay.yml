name: Replay audited security discovery projection
on:
  push:
    branches: [security/candidate-discovery-contracts]
    paths: ['.github/workflows/security-projection-replay.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover archived historical reports and audited SQLite
        uses: actions/download-artifact@v4
        with:
          run-id: 43115695557
          name: heldout-aiohttp-follow-symlinks-vulnerable
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source-evidence
      - name: Install schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q 'jsonschema==4.25.1'
      - name: Produce bounded replay configs
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive = Path(os.environ["RUNNER_TEMP"]) / "source-evidence"
          target = Path(os.environ["RUNNER_TEMP"]) / "projection"
          target.mkdir()
          meta = json.loads((archive / "metadata.json").read_text())
          assert meta["source_repo"] == "aio-libs/aiohttp"
          assert meta["source_commit"] == "33ccdfb0a12690af5bb49bda2319ec0907fa7827"
          for engine in ("semgrep", "codeql"):
              selection = ["python"] if engine == "semgrep" else ["security-extended"]
              ruleset_ref = ("semgrep/semgrep-rules@" + meta["semgrep_rules_commit"] if engine == "semgrep"
                             else "github/codeql-action@" + meta["codeql_action_commit"])
              descriptor = json.dumps({"engine": engine, "selection": selection,
                                       "ruleset_ref": ruleset_ref}, sort_keys=True).encode()
              (target / f"{engine}-ruleset-config.json").write_bytes(descriptor)
              report = json.loads((archive / ("semgrep.json" if engine == "semgrep"
                                              else "codeql.sarif")).read_text())
              if engine == "semgrep":
                  assert len(report["results"]) == 108
                  assert all("django" in x["extra"]["metadata"]["technology"]
                             for x in report["results"])
                  rule_ids = sorted({x["check_id"] for x in report["results"]})
                  family = "CWE-400"
                  claim = "SCANNED_NOT_APPLICABLE"
                  evidence = "report:metadata:technology=django;source-framework=aiohttp"
                  version = (archive / "semgrep-version.txt").read_text().strip()
              else:
                  results = report["runs"][0]["results"]
                  assert len(results) == 1 and results[0]["ruleId"] == "py/log-injection"
                  rule_ids = ["py/log-injection"]
                  family = "CWE-117"
                  claim = "SCANNED_APPLICABILITY_UNPROVEN"
                  evidence = "report:CodeQL-log-injection-rule;not-a-CWE-22-detection"
                  version = meta["codeql_cli_version"]
              config = {
                  "schema": "excession.security.projection-input.v1",
                  "repository": meta["source_repo"],
                  "scanner": {"engine": engine, "version": version,
                              "toolchain_ref": ruleset_ref},
                  "ruleset": {"immutable_ref": ruleset_ref,
                              "configuration_sha256": hashlib.sha256(descriptor).hexdigest(),
                              "selection": selection},
                  "scope": {"languages": ["python"], "include_paths": ["."],
                            "excluded_paths": []},
                  "execution_evidence_refs": [
                      "github-actions:43115695557",
                      "archive:heldout-aiohttp-follow-symlinks-vulnerable",
                  ],
                  "coverages": [
                      {"target": {"language": "python", "framework": "aiohttp",
                                  "weakness_family": family, "source_scope": "."},
                       "claim": claim, "rule_ids": rule_ids, "evidence_refs": [evidence]},
                      {"target": {"language": "python", "framework": "aiohttp",
                                  "weakness_family": "CWE-22", "source_scope": "."},
                       "claim": "SCANNED_APPLICABILITY_UNPROVEN", "rule_ids": [],
                       "evidence_refs": ["archived-run:43115695557:no-CWE22-alert-observed"]},
                  ],
              }
              (target / f"{engine}-config.json").write_text(json.dumps(config, indent=2))
          PY
      - name: Project both audited reports into distinct coverage and candidates
        shell: bash
        run: |
          set -euo pipefail
          for ENGINE in semgrep codeql; do
            REPORT="$RUNNER_TEMP/source-evidence/semgrep.json"
            if [ "$ENGINE" = codeql ]; then REPORT="$RUNNER_TEMP/source-evidence/codeql.sarif"; fi
            "$RUNNER_TEMP/venv/bin/python" tools/project_security_discovery.py \
              --config "$RUNNER_TEMP/projection/$ENGINE-config.json" \
              --ruleset-configuration "$RUNNER_TEMP/projection/$ENGINE-ruleset-config.json" \
              --report "$REPORT" \
              --database "$RUNNER_TEMP/source-evidence/$ENGINE.sqlite" \
              --ingest-receipt "$RUNNER_TEMP/source-evidence/$ENGINE-ingest.json" \
              --audit-receipt "$RUNNER_TEMP/source-evidence/$ENGINE-audit.json" \
              --output "$RUNNER_TEMP/projection/$ENGINE-bundle.json"
          done
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "projection"
          for engine, expected in (("semgrep", 108), ("codeql", 1)):
              bundle = json.loads((root / f"{engine}-bundle.json").read_text())
              candidates, coverages = bundle["candidates"], bundle["coverages"]
              assert len(candidates) == expected, (engine, len(candidates))
              assert len(coverages) == 2, (engine, len(coverages))
              assert all(x["claim"] == "UNVERIFIED_STATIC_CANDIDATE" for x in candidates)
              by_id = {x["coverage_id"]: x for x in coverages}
              assert all(by_id[x["coverage_id"]]["target"]["weakness_family"] != "CWE-22"
                         for x in candidates)
              assert any(x["target"]["weakness_family"] == "CWE-22"
                         and x["claim"] == "SCANNED_APPLICABILITY_UNPROVEN"
                         for x in coverages)
              print(f"{engine}: {expected} audited candidates, no CWE-22 candidate")
          PY
      - name: Save replay projections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-security-discovery-projections
          path: ${{ runner.temp }}/projection/
          if-no-files-found: warn
          retention-days: 30
