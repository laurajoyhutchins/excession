name: Excession self-analysis (advisory)

on:
  pull_request:
    paths:
      - '.github/workflows/self-analysis.yml'
      - 'tools/self_analysis.py'
      - 'tests/test_self_analysis.py'
      - 'docs/SELF_ANALYSIS.md'
      - 'core/src/**'
      - 'core/adapters/**'
      - 'tests/**'
      - 'tools/**'
      - 'benchmarks/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-analysis.yml'
      - 'tools/self_analysis.py'
      - 'tests/test_self_analysis.py'
      - 'core/src/**'
      - 'core/adapters/**'
      - 'tests/**'
      - 'tools/**'
      - 'benchmarks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-analysis:
    name: Audit pinned self-source and dependency candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install and prefetch optional Tree-sitter grammars
        run: |
          python3 -m pip install --disable-pip-version-check tree-sitter-language-pack==1.25.0
          python3 -c 'from tree_sitter_language_pack import prefetch; prefetch(["rust", "python", "javascript", "typescript", "go", "c", "java"])'
      - name: Build actual Excession binary
        run: cargo +1.99.1 build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Adversarial self-analysis reporting tests
        run: python3 -m unittest discover -s tests -p 'test_self_analysis.py' -v
      - name: Create clean source snapshot for self-analysis
        run: git worktree add --detach "$RUNNER_TEMP/excession-self-source" "$GITHUB_SHA"
      - name: Compile pinned snapshot and capture real Cargo dep-info
        run: |
          SOURCE="$RUNNER_TEMP/excession-self-source"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/excession-native-target"
          cargo +1.99.1 build --offline --locked --manifest-path "$SOURCE/core/Cargo.toml" --bin excession
          RUSTC="$(rustup which rustc --toolchain 1.99.1)"
          RUSTC_VERSION="$("$RUSTC" --version)"
          BIN="$GITHUB_WORKSPACE/core/target/debug/excession"
          OUT="$GITHUB_WORKSPACE/self-analysis-artifacts"
          mkdir -p "$OUT"
          "$BIN" syntax cargo-depfile --repo "$SOURCE" --package-root core \
            --depfile "$CARGO_TARGET_DIR/debug/libexcession.d" \
            --subject core/src/lib.rs --rustc "$RUSTC" --rustc-version "$RUSTC_VERSION" \
            > "$OUT/native-lib.json"
          "$BIN" syntax cargo-depfile --repo "$SOURCE" --package-root core \
            --depfile "$CARGO_TARGET_DIR/debug/excession.d" \
            --subject core/src/bin/excession.rs --rustc "$RUSTC" --rustc-version "$RUSTC_VERSION" \
            > "$OUT/native-bin.json"
      - name: Analyze detached, clean source at the exact workflow commit
        run: |
          SOURCE="$RUNNER_TEMP/excession-self-source"
          BASE="$(git -C "$SOURCE" rev-parse "$GITHUB_SHA^1")"
          python3 tools/self_analysis.py \
            --repo "$SOURCE" \
            --bin "$GITHUB_WORKSPACE/core/target/debug/excession" \
            --out "$GITHUB_WORKSPACE/self-analysis-artifacts" \
            --rev "$GITHUB_SHA" \
            --base-rev "$BASE" \
            --native-lib "$GITHUB_WORKSPACE/self-analysis-artifacts/native-lib.json" \
            --native-bin "$GITHUB_WORKSPACE/self-analysis-artifacts/native-bin.json"
      - name: Report advisory observations
        run: cat self-analysis-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain self-analysis evidence and refusal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-self-analysis
          path: self-analysis-artifacts/
          if-no-files-found: warn
