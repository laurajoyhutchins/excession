name: Simple repository retrieval probes

on:
  pull_request:
    paths:
      - 'benchmarks/micro/locate.py'
      - 'benchmarks/micro/lsp_probe.py'
      - 'benchmarks/micro/symbol_compare.py'
      - 'benchmarks/micro/simple_common.py'
      - 'benchmarks/calibration-h11.json'
      - 'benchmarks/fixtures/**'
      - 'tests/test_simple_probes.py'
      - '.github/workflows/simple-probes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simple-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust for full manual benchmark
        if: github.event_name == 'workflow_dispatch'
        run: rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned Python test dependency
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/locks/research-linux-cp313-x86_64.txt
      - name: Build native CLI for full manual benchmark
        if: github.event_name == 'workflow_dispatch'
        run: cargo build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Unit tests (JUnit XML)
        run: python3 -m pytest -q tests/test_simple_probes.py --junitxml=test-results/simple-probes.xml
      - name: Retain JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-simple-probes-junit
          path: test-results/simple-probes.xml
          if-no-files-found: warn
      - name: Install comparison tools for full manual benchmark
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          sudo timeout 180 apt-get update -qq
          sudo timeout 180 apt-get install -y ripgrep clangd
          rg --version | head -1
          clangd --version | head -1
      - name: Exact module-file lookup, four arms
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git clone -q core/fixtures/h11-crossrepo.bundle "$RUNNER_TEMP/h11"
          ./core/target/debug/excession index --repo "$RUNNER_TEMP/h11" \
            --db "$RUNNER_TEMP/simple-index.sqlite" --name h11 \
            --rev HEAD --roots h11,tests
          python3 benchmarks/micro/locate.py \
            --repo "$RUNNER_TEMP/h11" --db "$RUNNER_TEMP/simple-index.sqlite" \
            --bin ./core/target/debug/excession \
            --tasks benchmarks/calibration-h11.json --name h11 \
            --out "$RUNNER_TEMP/simple-location" --repetitions 3
          cat "$RUNNER_TEMP/simple-location/summary.json"
      - name: LSP definition versus literal occurrence smoke
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 benchmarks/micro/symbol_compare.py --repo . \
            --out "$RUNNER_TEMP/simple-symbol" --repetitions 3
          cat "$RUNNER_TEMP/simple-symbol/summary.json"
      - name: Retain measurements
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: excession-simple-tool-retrieval
          path: |
            ${{ runner.temp }}/simple-location/
            ${{ runner.temp }}/simple-symbol/
          if-no-files-found: warn
