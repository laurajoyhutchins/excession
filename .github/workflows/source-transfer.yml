name: Temporary exact-head slice verification
on:
  push:
    branches: [tmp/source-transfer-rust-slice-20261111]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0185c8f8a3e47e8c1398aeb0b2a18463f65aa85e
          fetch-depth: 1
          persist-credentials: false
      - name: Verify pinned checkout
        run: test "$(git rev-parse HEAD)" = 0185c8f8a3e47e8c1398aeb0b2a18463f65aa85e
      - name: Restore pinned compiler and lint components
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rust formatting and strict lints
        run: |
          cargo fmt --all --manifest-path core/Cargo.toml -- --check
          cargo clippy --offline --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Offline Rust unit and integration tests
        run: cargo test --offline --manifest-path core/Cargo.toml
      - name: Focused executable-slice and historical integration tests
        run: |
          python3 -m unittest discover -s tests -p test_executable_slices.py -v
          python3 -m unittest discover -s tests -p test_evidence_history.py -v
          python3 -m unittest discover -s tests -p test_slice_rust_migration.py -v
          python3 -m unittest discover -s tests -p test_cli.py -v
