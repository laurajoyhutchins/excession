name: Source-bound impact acceptance and replay cost

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-witness-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install independent source-oracle dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build current source-witness-only executable
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 fetch --locked --manifest-path core/Cargo.toml
          cargo +1.99.1 build --locked --offline --release \
            --manifest-path core/Cargo.toml --bin excession
      - name: Check pinned Requests source and replay, including adversarial refusal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-witness-benchmark
          python3 benchmarks/experiments/real_fixtures.py \
            --bin core/target/release/excession \
            --manifest benchmarks/fixtures/real-repositories.json \
            --out /tmp/source-witness-benchmark/requests.json \
            --repetitions 1 --fixture requests --product-fixture requests \
            --source-replay
      - name: Validate source-only product contract and retain cost receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("/tmp/source-witness-benchmark")
          fixture = json.loads((root / "requests.json").read_text())
          if (fixture["passed"], fixture["failed"]) != (1, 0):
              raise SystemExit("Pinned Requests independent source-oracle acceptance failed")
          checked = fixture["fixtures"][0]
          counts = checked["dependency_audit"]["counts"]
          if counts["missing_edges"] or counts["unexpected_edges"]:
              raise SystemExit("Independent Git/AST source-edge inventory diverged")
          product = checked["product_workflow"]
          sources = product["source_replay_acceptance"]
          if (not sources or not sources["batch_source_complete"]
                  or sources["batch_source_count"] < 2
                  or not product["forged_report_refused"]
                  or product["reported_coverage"] != "PARTIAL"
                  or product["semantic_correctness"] != "NOT_EVALUATED"):
              raise SystemExit("Source witness replay promoted or omitted evidence")
          cost = {
              "schema": "excession.source-only-replay-cost.v1",
              "binary_sha256": fixture["binary_sha256"],
              "source_commit": checked["source_commit"],
              "source_oracle_counts": counts,
              "not_proven_import_sites": product["not_proven_import_sites"],
              "distinct_sources": sources["batch_source_count"],
              "impact_report_bytes": product["impact_report_bytes"],
              "impact_wall_ms": product["impact_wall_ms"],
              "single_source_wall_ms": product["explain_wall_ms"],
              "single_source_audit_wall_ms": product["audit_wall_ms"],
              "batch_wall_ms": sources["batched_source_explanation_wall_ms"],
              "interpretation": (
                  "Single-host total process wall times including Git, SQL, and parser work; "
                  "not a proof of runtime dependencies or a statistical speedup"
              ),
          }
          (root / "cost.json").write_text(json.dumps(cost, sort_keys=True, indent=2) + "\n")
          print(json.dumps(cost, sort_keys=True, indent=2))
          PY
      - name: Preserve receipts on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-witness-benchmark
          path: /tmp/source-witness-benchmark/
          if-no-files-found: warn
          retention-days: 30
