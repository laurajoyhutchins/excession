name: Structural preservation (trusted manual evidence)

# Executes repository code from two Git commits. This is NOT a sandbox and
# must never run for arbitrary pull_request or issue content.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Exact trusted base commit (40 lowercase hex digits)"
        required: true
        type: string
      candidate:
        description: "Exact reviewed candidate commit (40 lowercase hex digits)"
        required: true
        type: string
      contract:
        description: "Reviewed contract under quality/structural-contracts/"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  receipts:
    if: github.repository == 'laurajoyhutchins/excession' && github.ref == 'refs/heads/main' && github.actor_id == '219002713'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source identities and trusted contract path
        env:
          SOURCE_BASE: ${{ inputs.base }}
          SOURCE_CANDIDATE: ${{ inputs.candidate }}
          SOURCE_CONTRACT: ${{ inputs.contract }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_CONTRACT" =~ ^quality/structural-contracts/[A-Za-z0-9_.-]+\.json$ ]]
          test -f "$SOURCE_CONTRACT"
          if ! git cat-file -e "$SOURCE_BASE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$SOURCE_BASE"
          fi
          if ! git cat-file -e "$SOURCE_CANDIDATE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$SOURCE_CANDIDATE"
          fi
          git cat-file -e "$SOURCE_BASE^{commit}"
          git cat-file -e "$SOURCE_CANDIDATE^{commit}"
      - uses: jdx/mise-action@v5
      - name: Build source-pinned Excession source-impact verifier
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path core/Cargo.toml
          cargo build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Obtain native source-impact and open-obligation evidence
        env:
          SOURCE_BASE: ${{ inputs.base }}
          SOURCE_CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          core/target/debug/excession agent verify --repo . \
            --base "$SOURCE_BASE" --candidate "$SOURCE_CANDIDATE" \
            --roots core/src,core/adapters,tests,tools --limit 64 \
            > "$RUNNER_TEMP/excession-agent-verification.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "excession-agent-verification.json").read_text())
          assert report["schema"] == "excession.agent-verification.v1"
          assert report["base_commit"] == os.environ["SOURCE_BASE"]
          assert report["candidate_commit"] == os.environ["SOURCE_CANDIDATE"]
          assert report["candidate_tree"] == subprocess.check_output(
              ["git", "rev-parse", os.environ["SOURCE_CANDIDATE"] + "^{tree}"], text=True).strip()
          assert report["ready_to_merge"] is False
          assert report["safe_to_skip_unlisted_tests"] is False
          assert report["status"] == "OPEN_OBLIGATIONS"
          print("Source impact is Git-bound; semantic and test obligations remain OPEN.")
          PY
      - name: Run reviewed commands in independent source worktrees
        env:
          SOURCE_BASE: ${{ inputs.base }}
          SOURCE_CANDIDATE: ${{ inputs.candidate }}
          SOURCE_CONTRACT: ${{ inputs.contract }}
        run: |
          set -euo pipefail
          python3 tools/ci/structural_preservation.py \
            --repo . --base "$SOURCE_BASE" --candidate "$SOURCE_CANDIDATE" \
            --contract "$SOURCE_CONTRACT" \
            --out "$RUNNER_TEMP/structural-preservation.json" --trusted-local true
      - name: Preserve positive and negative execution observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-preservation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/structural-preservation.json
            ${{ runner.temp }}/excession-agent-verification.json
          retention-days: 30
          if-no-files-found: warn
