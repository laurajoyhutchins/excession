name: Multi-language syntax parsers

on:
  pull_request:
    paths:
      - '.github/workflows/syntax-parsers.yml'
      - 'rust-toolchain.toml'
      - '.python-version'
      - 'mise.toml'
      - 'mise.*.toml'
      - 'core/src/native_syntax.rs'
      - 'core/Cargo.toml'
      - 'core/Cargo.lock'
      - 'requirements/research.txt'
      - 'core/src/syntax.rs'
      - 'core/src/preflight.rs'
      - 'core/src/syntax_resolution.rs'
      - 'core/src/semantic_contract.rs'
      - 'contracts/semantic/**'
      - 'contracts/evidence/**'
      - 'contracts/vendor/**'
      - 'core/tests/semantic_adapters.rs'
      - 'tests/test_semantic_contracts.py'
      - 'tests/test_evidence_contracts.py'
      - 'tools/validate_semantic_contract.py'
      - 'tools/validate_evidence_contract.py'
      - 'core/src/evidence_query.rs'
      - 'tests/test_evidence_query_cli.py'
      - 'docs/EVIDENCE_QUERY.md'
      - 'core/src/native_boundary.rs'
      - 'core/src/native_discovery.rs'
      - 'tools/native_language_adapter.py'
      - 'tools/excession_ts_resolve.cjs'
      - 'core/src/git.rs'
      - 'core/src/adapter.rs'
      - 'core/src/bin/excession.rs'
      - 'core/src/lib.rs'
      - 'core/src/observe/**'
      - 'core/src/evidence/preflight.rs'
      - 'core/src/graph/evidence_query.rs'
      - 'core/src/source/git.rs'
      - 'core/tests/syntax_contracts.rs'
      - 'core/tests/preflight_contracts.rs'
      - 'core/tests/native_boundary_contracts.rs'
      - 'core/tests/native_inline_contracts.rs'
      - 'core/tests/refactor_contracts.rs'
      - 'tests/test_native_inline_cli.py'
      - 'tests/test_python_native_resolution.py'
      - 'docs/SYNTAX_PARSERS.md'
      - 'docs/PYTHON_NATIVE_RESOLUTION.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  grammar-smoke:
    name: Multi-language syntax grammar smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: rust,python,node,go
      TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: /tmp/excession-grammars
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Confirm Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Prefetch all recognized syntax grammars with mise
        run: mise run syntax-setup-all
      - name: Check optional mise profiles without installing extra toolchains
        run: |
          for profile in jvm dotnet ruby php beam swift native; do
            mise -E "$profile" config >/dev/null
          done
      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Install locked TypeScript compiler API
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Excession CLI
        run: cargo build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Rust native parser contract and prefetched multilingual grammars
        run: cargo test --offline --locked --manifest-path core/Cargo.toml --lib native_syntax::tests
      - name: Rust semantic adapter integration
        run: cargo test --offline --locked --manifest-path core/Cargo.toml --test semantic_adapters
      - name: Validate ODCS 3.2 and both JSON Schema catalogues
        run: |
          python3 tools/validate_semantic_contract.py
          python3 tools/validate_evidence_contract.py
      - name: Source-bound Rust grammar and native input contracts
        run: cargo test --offline --locked --manifest-path core/Cargo.toml --test syntax_contracts --test preflight_contracts --test native_boundary_contracts --test native_inline_contracts
      - name: Install optional Python oracle dependencies
        run: mise run setup-python
      - name: Python adapter, resolver and independent observation checks (JUnit XML)
        run: python3 -m pytest -q tests/test_native_inline_cli.py tests/test_python_native_resolution.py tests/test_evidence_query_cli.py tests/test_semantic_contracts.py tests/test_evidence_contracts.py --junitxml=test-results/syntax-parsers.xml
      - name: Retain JUnit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: excession-syntax-parsers-junit
          path: test-results/syntax-parsers.xml
          if-no-files-found: warn
