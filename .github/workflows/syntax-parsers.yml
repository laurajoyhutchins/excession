name: Multi-language syntax parsers

on:
  pull_request:
    paths:
      - '.github/workflows/syntax-parsers.yml'
      - 'core/adapters/tree_sitter.py'
      - 'core/src/syntax.rs'
      - 'core/src/git.rs'
      - 'core/src/adapter.rs'
      - 'core/src/bin/excession.rs'
      - 'core/src/lib.rs'
      - 'tests/test_tree_sitter_bridge.py'
      - 'tests/test_syntax_cli.py'
      - 'docs/SYNTAX_PARSERS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-smoke:
    name: Rust, Go, C, Java grammar smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install optional parser and prefetch grammars
        run: |
          python3 -m pip install --disable-pip-version-check tree-sitter-language-pack==1.25.0
          python3 -c 'from tree_sitter_language_pack import prefetch; prefetch(["rust", "go", "c", "java"])'
      - name: Build Excession CLI
        run: cargo +1.99.1 build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Run parser unit and Git integration tests
        run: |
          python3 -m unittest discover -s tests -p test_tree_sitter_bridge.py -v
          python3 -m unittest discover -s tests -p test_syntax_cli.py -v
