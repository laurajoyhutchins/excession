name: Multi-language syntax parsers

on:
  pull_request:
    paths:
      - '.github/workflows/syntax-parsers.yml'
      - 'rust-toolchain.toml'
      - '.python-version'
      - 'requirements/syntax.txt'
      - 'requirements/research.txt'
      - 'requirements/locks/**'
      - 'tools/grammar_artifacts.py'
      - 'tests/test_grammar_artifacts.py'
      - 'core/adapters/tree_sitter.py'
      - 'core/src/syntax.rs'
      - 'core/src/preflight.rs'
      - 'core/src/syntax_resolution.rs'
      - 'core/src/native_boundary.rs'
      - 'core/src/git.rs'
      - 'core/src/adapter.rs'
      - 'core/src/bin/excession.rs'
      - 'core/src/lib.rs'
      - 'tests/test_tree_sitter_bridge.py'
      - 'core/tests/syntax_contracts.rs'
      - 'core/tests/preflight_contracts.rs'
      - 'core/tests/native_boundary_contracts.rs'
      - 'docs/SYNTAX_PARSERS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-smoke:
    name: Rust, Go, C, Java grammar smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: /tmp/excession-grammars
    steps:
      - uses: actions/checkout@v4
      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Fast grammar-independent adapter contract tests
        run: |
          python3 -m unittest discover -s tests -p test_tree_sitter_bridge.py -v
          python3 -m unittest discover -s tests -p test_grammar_artifacts.py -v
      - name: Install SHA-256-locked parser and research wheels
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all:
          -r requirements/locks/research-linux-cp313-x86_64.txt
          -r requirements/locks/syntax-linux-cp313-x86_64.txt
      - name: Trusted grammar prefetch
        run: python3 -c 'from tree_sitter_language_pack import prefetch; prefetch(["rust", "go", "c", "java", "python", "typescript", "javascript"])'
      - name: Authenticate cached grammar library SHA-256 hashes offline
        run: python3 tools/grammar_artifacts.py verify
      - name: Build Excession CLI
        run: cargo build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Rust source-bound syntax and preflight contracts
        run: cargo test --offline --locked --manifest-path core/Cargo.toml --test syntax_contracts --test preflight_contracts --test native_boundary_contracts
      - name: Python Tree-sitter bridge checks (JUnit XML)
        run: python3 -m pytest -q tests/test_tree_sitter_bridge.py --junitxml=test-results/syntax-parsers.xml
      - name: Retain JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-syntax-parsers-junit
          path: test-results/syntax-parsers.xml
          if-no-files-found: warn
