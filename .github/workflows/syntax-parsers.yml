name: Multi-language syntax parsers

on:
  pull_request:
    paths:
      - '.github/workflows/syntax-parsers.yml'
      - 'rust-toolchain.toml'
      - '.python-version'
      - 'mise.toml'
      - 'requirements/syntax.txt'
      - 'requirements/research.txt'
      - 'core/adapters/tree_sitter.py'
      - 'core/src/syntax.rs'
      - 'core/src/preflight.rs'
      - 'core/src/syntax_resolution.rs'
      - 'core/src/native_boundary.rs'
      - 'core/src/git.rs'
      - 'core/src/adapter.rs'
      - 'core/src/bin/excession.rs'
      - 'core/src/lib.rs'
      - 'tests/test_tree_sitter_bridge.py'
      - 'tests/test_syntax_cli.py'
      - 'tests/test_preflight_cli.py'
      - 'tests/test_syntax_resolution_cli.py'
      - 'tests/test_native_boundary_cli.py'
      - 'docs/SYNTAX_PARSERS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-smoke:
    name: Rust, Go, C, Java grammar smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: rust,python
      TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: /tmp/excession-grammars
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Confirm Rust toolchain
        run: rustup show active-toolchain
      - name: Fast grammar-independent adapter contract tests
        run: python3 -m unittest discover -s tests -p test_tree_sitter_bridge.py -v
      - name: Install pinned parser and research dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements/research.txt -r requirements/syntax.txt
      - name: Trusted grammar prefetch
        run: python3 -c 'from tree_sitter_language_pack import prefetch; prefetch(["rust", "go", "c", "java", "python", "typescript", "javascript"])'
      - name: Build Excession CLI
        run: cargo build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Run parser unit and Git integration tests (JUnit XML)
        run: python3 -m pytest -q tests/test_tree_sitter_bridge.py tests/test_syntax_cli.py tests/test_syntax_resolution_cli.py tests/test_preflight_cli.py tests/test_native_boundary_cli.py --junitxml=test-results/syntax-parsers.xml
      - name: Retain JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-syntax-parsers-junit
          path: test-results/syntax-parsers.xml
          if-no-files-found: warn
