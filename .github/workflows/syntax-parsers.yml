name: Multi-language syntax parsers

on:
  pull_request:
    paths:
      - '.github/workflows/syntax-parsers.yml'
      - 'rust-toolchain.toml'
      - '.python-version'
      - 'mise.toml'
      - 'mise.*.toml'
      - 'tests/test_polyglot_grammars.py'
      - 'requirements/syntax.txt'
      - 'requirements/research.txt'
      - 'core/adapters/tree_sitter.py'
      - 'core/src/observe/syntax.rs'
      - 'core/src/evidence/preflight.rs'
      - 'core/src/observe/syntax_resolution.rs'
      - 'core/src/graph/evidence_query.rs'
      - 'tests/test_evidence_query_cli.py'
      - 'docs/EVIDENCE_QUERY.md'
      - 'core/src/observe/native_boundary.rs'
      - 'core/src/observe/native_discovery.rs'
      - 'tools/native_language_adapter.py'
      - 'tools/excession_ts_resolve.cjs'
      - 'core/src/source/git.rs'
      - 'core/src/observe/adapter.rs'
      - 'core/src/bin/excession.rs'
      - 'core/src/lib.rs'
      - 'tests/test_tree_sitter_bridge.py'
      - 'tests/test_syntax_cli.py'
      - 'tests/test_preflight_cli.py'
      - 'tests/test_syntax_resolution_cli.py'
      - 'tests/test_native_boundary_cli.py'
      - 'tests/test_native_inline_cli.py'
      - 'tests/test_python_native_resolution.py'
      - 'docs/SYNTAX_PARSERS.md'
      - 'docs/PYTHON_NATIVE_RESOLUTION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grammar-smoke:
    name: Multi-language syntax grammar smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: rust,python,node,go
      TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: /tmp/excession-grammars
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - name: Confirm Rust toolchain
        run: rustup show active-toolchain
      - name: Fast grammar-independent adapter contract tests
        run: python3 -m unittest discover -s tests -p test_tree_sitter_bridge.py -v
      - name: Prefetch all recognized syntax grammars with mise
        run: mise run syntax-setup-all
      - name: Check optional mise profiles without installing extra toolchains
        run: |
          for profile in jvm dotnet ruby php beam swift native; do
            mise -E "$profile" config >/dev/null
          done
      - name: Check polyglot parser availability (offline)
        run: python3 -m unittest discover -s tests -p test_polyglot_grammars.py -v
      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Install locked TypeScript compiler API
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Excession CLI
        run: cargo build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Run parser unit and Git integration tests (JUnit XML)
        run: python3 -m pytest -q tests/test_tree_sitter_bridge.py tests/test_syntax_cli.py tests/test_syntax_resolution_cli.py tests/test_preflight_cli.py tests/test_native_boundary_cli.py tests/test_native_inline_cli.py tests/test_python_native_resolution.py tests/test_evidence_query_cli.py --junitxml=test-results/syntax-parsers.xml
      - name: Retain JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-syntax-parsers-junit
          path: test-results/syntax-parsers.xml
          if-no-files-found: warn
