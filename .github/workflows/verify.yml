name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Rust and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: rust,node
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: jdx/mise-action@v5
      - name: Confirm Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Install development dependencies with mise
        run: mise run setup
      - name: Prefetch locked Cargo dependencies
        run: cargo fetch --locked --manifest-path core/Cargo.toml
      - name: Install pinned Rust test reporter
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --offline --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Install pinned optional Python for independent oracles
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install opt-in Python test dependencies
        run: mise run setup-python
      - name: Rust tests (JUnit XML)
        run: cargo nextest run --offline --locked --manifest-path core/Cargo.toml --profile ci
      - name: Rust doctests
        run: cargo test --offline --locked --manifest-path core/Cargo.toml --doc
      - name: Build CLI for mandatory impact acceptance
        run: cargo build --offline --locked --manifest-path core/Cargo.toml --bin excession
      - name: Dogfood source-bound agent contracts on Excession itself
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse 'HEAD^1')"
          HEAD="$(git rev-parse HEAD)"
          OUT="$RUNNER_TEMP/excession-contract-dogfood"
          mkdir -p "$OUT"
          core/target/debug/excession agent context --repo . --rev "$HEAD" \
            --focus core/src/agent.rs,contracts/README.md --roots core/src \
            --task "Review the contract refactoring" --limit 64 > "$OUT/context.json"
          core/target/debug/excession agent verify --repo . --base "$BASE" \
            --candidate "$HEAD" --roots core/src --limit 64 > "$OUT/verification.json"
          python3 - "$OUT" "$BASE" "$HEAD" <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          out, base, head = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          context = json.loads((out / "context.json").read_text())
          verification = json.loads((out / "verification.json").read_text())
          def git(*args):
              return subprocess.check_output(("git", *args)).decode().strip()

          assert context["schema"] == "excession.agent-context.v1"
          assert context["source_commit"] == head
          assert context["source_tree"] == git("rev-parse", head + "^{tree}")
          assert context["coverage"]["status"] == "PARTIAL"
          assert context["safe_to_skip_unlisted_tests"] is False
          for source in context["sources"]:
              assert source["source_commit"] == head
              assert source["blob"] == git("rev-parse", head + ":" + source["path"])
          assert verification["schema"] == "excession.agent-verification.v1"
          assert verification["base_commit"] == base
          assert verification["candidate_commit"] == head
          assert verification["candidate_tree"] == context["source_tree"]
          assert verification["status"] == "OPEN_OBLIGATIONS"
          assert verification["ready_to_merge"] is False
          assert verification["safe_to_skip_unlisted_tests"] is False
          assert verification["replay"]["semantic_correctness"] == "NOT_EVALUATED"
          assert verification["coverage"]["status"] == "PARTIAL"
          assert "SEMANTIC_CORRECTNESS_NOT_EVALUATED" in verification["obligations"]
          expected = set(filter(None, subprocess.check_output(
              ("git", "diff", "--name-only", "-z", base, head)
          ).decode().split("\0")))
          assert verification["change_count"] == len(expected)
          if not verification["coverage"]["truncated"]:
              observed = {
                  (item["after"] or item["before"])["path"]
                  for item in verification["changes"]
              }
              assert observed == expected, (observed ^ expected)
          print("Excession self-verification: Git identities match; "
                f"{len(expected)} paths accounted for; safety obligations remain open.")
          PY
      - name: JavaScript adapter tests
        run: npm run check && npm test
      - name: Python-specific tooling and independent oracle tests (JUnit XML)
        env:
          EXCESSION_REQUIRE_BIN: '1'
        run: python3 -m pytest -q tests --junitxml=test-results/python.xml
      - name: Retain test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: excession-junit
          path: |
            core/target/nextest/ci/junit.xml
            test-results/python.xml
          if-no-files-found: warn
