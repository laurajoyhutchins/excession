name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked JavaScript parser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install SHA-256-locked Python wheels
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements/locks/research-linux-cp313-x86_64.txt
      - name: Observe loaded native library ABIs
        run: python3 tools/native_runtime.py
      - name: Install pinned Rust test reporter
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - name: Format
        run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --offline --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests (JUnit XML)
        run: cargo nextest run --offline --locked --manifest-path core/Cargo.toml --profile ci
      - name: Rust doctests
        run: cargo test --offline --locked --manifest-path core/Cargo.toml --doc
      - name: JavaScript adapter tests
        run: npm run check && npm test
      - name: Python tooling and independent oracle tests (JUnit XML)
        run: python3 -m pytest -q tests --junitxml=test-results/python.xml
      - name: Retain test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-junit
          path: |
            core/target/nextest/ci/junit.xml
            test-results/python.xml
          if-no-files-found: warn
