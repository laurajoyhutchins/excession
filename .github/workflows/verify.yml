name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned Python test dependency
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Install pinned Rust test reporter
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - name: Format
        run: cargo +1.99.1 fmt --manifest-path core/Cargo.toml -- --check
      - name: Clippy
        run: cargo +1.99.1 clippy --offline --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests (JUnit XML)
        run: cargo +1.99.1 nextest run --offline --locked --manifest-path core/Cargo.toml --profile ci
      - name: Rust doctests
        run: cargo +1.99.1 test --offline --locked --manifest-path core/Cargo.toml --doc
      - name: Python integration tests (JUnit XML)
        run: python3 -m pytest -q tests --junitxml=test-results/python.xml
      - name: Retain test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: excession-junit
          path: |
            core/target/nextest/ci/junit.xml
            test-results/python.xml
          if-no-files-found: warn
