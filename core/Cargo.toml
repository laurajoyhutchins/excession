[package]
autobins = false
name = "excession"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Excession: Git-backed relational views and auditable security evidence"

[lib]
name = "excession"
path = "src/lib.rs"

[[bin]]
name = "excession"
path = "src/bin/excession.rs"

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
