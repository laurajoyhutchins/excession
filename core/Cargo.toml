[package]
autobins = false
name = "excession"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Excession: Git-backed relational views and auditable security evidence"

[lib]
name = "excession"
path = "src/lib.rs"

[[bin]]
name = "excession"
path = "src/bin/excession.rs"

[dependencies]
# Local-only Draft 2020-12 validation. Disable remote resolution and TLS.
jsonschema = { version = "=0.61.1", default-features = false }
serde_json = "=1.0.154"

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
