[package]
autobins = false
name = "excession"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Excession: Git-grounded auditable code intelligence and evidence"

[lib]
name = "excession"
path = "src/lib.rs"

[[bin]]
name = "excession"
path = "src/bin/excession.rs"

[dependencies]
# Official Model Context Protocol Rust SDK. The SDK owns JSON-RPC and version negotiation.
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.49.0", features = ["rt-multi-thread", "io-std"] }
clap = { version = "=4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
# Local-only Draft 2020-12 validation. Disable remote resolution and TLS.
jsonschema = { version = "=0.61.1", default-features = false }
serde_json = "=1.0.154"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
libc = "=0.2.191"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
# URI encoding for native SCIP project roots; already present in the locked graph.
percent-encoding = "=2.3.2"
# Reuse the upstream Rust parser engine; grammars must be installed offline.
tree-sitter-language-pack = { version = "=1.25.0", default-features = false, features = ["dynamic-loading"] }

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
