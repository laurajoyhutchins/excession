[package]
name = "relgit"
version = "0.20.0"
edition = "2024"
license = "MIT"
description = "Git-backed relational index and conservative integration evidence, Rust core"

[lib]
name = "relgit"
path = "src/lib.rs"

[[bin]]
name = "relgit"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
lto = true
codegen-units = 1
