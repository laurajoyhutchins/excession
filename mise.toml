# mise reads each language's existing native version file.
# Rust remains authoritative in rust-toolchain.toml (including components).
[settings]
idiomatic_version_file_enable_tools = ["rust", "node", "go"]

[tasks.setup]
description = "Install JavaScript development dependencies; Python is optional"
run = "npm ci --ignore-scripts --no-audit --no-fund"

[tasks.setup-python]
description = "Opt-in Python test dependencies (use the pinned .python-version interpreter)"
run = "python -m pip install --disable-pip-version-check -r requirements/research.txt"

[tasks.check]
description = "Run the ordinary Rust and JavaScript checks"
run = "make check"

[tasks.check-full]
description = "Run Rust, JavaScript and opt-in Python checks"
run = "make check-full"

[tasks.go-check]
description = "Test the optional Go adapter"
run = "make go-check"

[tasks.cli]
description = "Build Excession's Rust CLI"
run = "make cli"

[tasks.syntax-setup]
description = "Install optional Tree-sitter grammars in a trusted setup step"
run = [
  "python -m pip install --disable-pip-version-check -r requirements/research.txt -r requirements/syntax.txt",
  "python -c 'from tree_sitter_language_pack import prefetch; prefetch([\"rust\",\"go\",\"c\",\"java\",\"python\",\"javascript\",\"typescript\"])'",
]

# Extended syntax support is opt-in. Compilers are not needed to parse Git blobs.
[tasks.syntax-setup-all]
description = "Prefetch grammars for all Excession syntax extensions"
depends = ["syntax-setup"]
run = "python -c 'import sys; from tree_sitter_language_pack import prefetch; prefetch(sys.argv[1:])' cpp kotlin csharp ruby php swift scala bash elixir json yaml toml sql"
