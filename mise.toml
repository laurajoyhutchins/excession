# mise reads each language's existing native version file.
# Rust remains authoritative in rust-toolchain.toml (including components).
[settings]
idiomatic_version_file_enable_tools = ["rust", "python", "node", "go"]

# Keep Python test dependencies out of the installed interpreter.
[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install ordinary Python and JavaScript development dependencies"
run = [
  "python -m pip install --disable-pip-version-check -r requirements/research.txt",
  "npm ci --ignore-scripts --no-audit --no-fund",
]

[tasks.check]
description = "Run the ordinary local checks"
run = "make check"

[tasks.go-check]
description = "Test the optional Go adapter"
run = "make go-check"

[tasks.cli]
description = "Build Excession's Rust CLI"
run = "make cli"

[tasks.syntax-setup]
description = "Install optional Tree-sitter grammars in a trusted setup step"
run = [
  "python -m pip install --disable-pip-version-check -r requirements/syntax.txt",
  "python -c 'from tree_sitter_language_pack import prefetch; prefetch([\"rust\",\"go\",\"c\",\"java\",\"python\",\"javascript\",\"typescript\"])'",
]
